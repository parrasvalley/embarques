<style>

<script>
var BUILD="v2026-10-15-NOM57";
(function(){try{
  var n=parseInt(sessionStorage.getItem("nom-rec")||"0",10);if(n>=6)return;
  fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()})
  .then(function(t){var m=t.match(/var BUILD="([^"]+)"/);
    if(m&&m[1]!==BUILD){sessionStorage.setItem("nom-rec",String(n+1));location.reload(true);}})
  .catch(function(){});
}catch(e){}})();
</script>
<script type="text/babel">
var uS=React.useState,uE=React.useEffect,uM=React.useMemo,uR=React.useRef;
var FB="https://parrasvalley-default-rtdb.firebaseio.com";
function fget(k){return fetch(FB+"/"+k+".json?t="+Date.now()).then(function(r){return r.json()}).catch(function(){return null})}
function fput(k,v){return fetch(FB+"/"+k+".json",{method:"PUT",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(v)}).then(function(r){return r.ok}).catch(function(){return false})}
function nf(v){var x=parseFloat(v);return isNaN(x)?0:x}
function mny(x){var n=Math.round(nf(x)*100)/100;
  return "$"+n.toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2})}
function hoyISO(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
var DIAS=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fTxt(f){var p=String(f||"").split("-");if(p.length!==3)return f;
  return DIAS[new Date(+p[0],+p[1]-1,+p[2]).getDay()]+" "+(+p[2])+" "+MESES[+p[1]-1]+" "+p[0]}
/* La fecha COMPLETA para las hojas que se imprimen (NOM55, 15/10/2026).
   [stated] Miguel: "que diga miercoles 14, jueves 15. Bien, toda la fecha
   completa. Porque eso es lo que se va a imprimir y se va a pasar al
   departamento de RH de nominas y ellos, pues ya que se les revuelva, no van a
   saber de que dia es cada hoja, porque no tienen encabezados." */
var DIAL=["domingo","lunes","martes","mi\u00e9rcoles","jueves","viernes","s\u00e1bado"];
var MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
          "septiembre","octubre","noviembre","diciembre"];
function fLarga(f){var p=String(f||"").split("-");if(p.length!==3)return f;
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  return DIAL[d.getDay()]+" "+(+p[2])+" de "+MESL[+p[1]-1]+" de "+p[0]}
function fCorto(f){var p=String(f||"").split("-");if(p.length!==3)return f;
  return DIAS[new Date(+p[0],+p[1]-1,+p[2]).getDay()].slice(0,3)+" "+(+p[2])+" "+MESES[+p[1]-1]}
function hm(s){var m=/^(\d{1,2}):(\d{2})$/.exec(String(s||""));if(!m)return null;
  var h=+m[1],i=+m[2];if(h>23||i>59)return null;return h*60+i}
function hhmm(m){m=Math.round(m);return Math.floor(m/60)+":"+("0"+(m%60)).slice(-2)}
function hdec(m){return (m/60).toFixed(2)}
function mh(x){x=((Math.round(x)%1440)+1440)%1440;
  return ("0"+Math.floor(x/60)).slice(-2)+":"+("0"+(x%60)).slice(-2)}
function nid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function sinAc(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().trim()}
function marco(t,base){var u=t;while(u<base)u+=1440;while(u-1440>=base)u-=1440;return u}
function ahora(){var d=new Date();return redHora(mh(d.getHours()*60+d.getMinutes()))}

/* El <input type=time> de Chrome deja el valor VACIO mientras no se teclee el
   AM/PM, y renglones bien capturados contaban cero. Aqui todo va en 24 h.   */
function parseHora(txt){
  var t=String(txt||"").trim(); if(!t)return "";
  var h,i,m=/^(\d{1,2})[:.\s](\d{1,2})$/.exec(t);
  if(m){h=+m[1];i=+m[2]}
  else{var dd=t.replace(/\D/g,""); if(!dd)return null;
    if(dd.length<=2){h=+dd;i=0}
    else if(dd.length===3){h=+dd.slice(0,1);i=+dd.slice(1)}
    else{h=+dd.slice(0,2);i=+dd.slice(2,4)}}
  if(isNaN(h)||isNaN(i)||h>23||i>59)return null;
  return ("0"+h).slice(-2)+":"+("0"+i).slice(-2)}

/* REDONDEO A LA MEDIA HORA (NOM31/42). Se aplica AL CAPTURAR, no al calcular:
   lo que se ve en el renglon es exactamente con lo que se calcula, y como el
   "+ intervalo" copia el fin del anterior, el siguiente arranca en la hora ya
   redondeada y nunca queda hueco ni se encima.
   Del minuto 1 al 14 baja a la hora, del 15 al 44 va a la media, del 45 en
   adelante sube a la hora siguiente.                                       */
var RED=30;
function redHora(s){
  if(!RED)return s;
  var t=hm(s); if(t==null)return s;
  return mh(Math.round(t/RED)*RED)}
function redMin(m){return RED?Math.round(m/RED)*RED:m}

var PAROS=["Comida","Cena"];
/* paros con motivo: ESTOS SI SE PAGAN, salvo que el renglon se marque "sin pago".
   Las horas se le cargan al area en la que venia la linea. */
var MOTIVOS=["Paro fruta","Paro mecanico","Paro luz","Paro otro"];
function esParoM(x){return MOTIVOS.indexOf(x)>=0}
function esParo(x){return PAROS.indexOf(x)>=0||x==="Comida / cena"}
/* todo lo que no es area de empaque */
function noAr(x){return esParo(x)||esParoM(x)}
var AREAS=["Persa","Slicer","Europeo","Morron","Minibel"];
/* color de cada area segun su verdura */
var COLAR={Persa:"#3fbf63",      /* pepino persa, verde */
           Slicer:"#0e9e86",     /* pepino slicer, verde oscuro */
           Europeo:"#b4d437",    /* pepino europeo, verde lima */
           Morron:"#e2452f",     /* chile morron, rojo */
           Minibel:"#f5a524"};   /* minibel, naranja */
function colAr(A){return COLAR[A]||"#86dd84"}
function rgbAr(h){h=h.replace("#","");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function osc(h,f){var r=rgbAr(h);
  return "rgb("+Math.round(r[0]*f)+","+Math.round(r[1]*f)+","+Math.round(r[2]*f)+")"}
function tra(h,a){var r=rgbAr(h);return "rgba("+r[0]+","+r[1]+","+r[2]+","+a+")"}
function Chip(p){var c=colAr(p.a);
  return <span className={"chip"+(p.sm?" sm2":"")}
    style={{background:"linear-gradient(180deg,"+c+" 0%,"+osc(c,.8)+" 55%,"+osc(c,.62)+" 100%)"}}>
    {p.t||p.a}</span>}
function Barra(p){return <div className="barra">
  {(p.ar||[]).map(function(A){return <i key={A} style={{background:
    "linear-gradient(180deg,"+colAr(A)+","+osc(colAr(A),.65)+")"}}/>})}</div>}
function Dot(p){return <span className="dot" style={{background:colAr(p.a)}}/>}
var OPTS=AREAS.concat(PAROS).concat(MOTIVOS);
var LINS=[{k:"emp",n:"Empaque",def:"Persa",ar:[],todas:true},
          {k:"ps",n:"Persa / Slicer",def:"Persa",ar:["Persa","Slicer"]},
          {k:"euro",n:"Europeo",def:"Europeo",ar:["Europeo"]},
          {k:"aux",n:"Auxiliar",def:"Morron",ar:["Morron","Minibel"]}];
var KS=LINS.map(function(l){return l.k});
function linDe(k){for(var i=0;i<LINS.length;i++)if(LINS[i].k===k)return LINS[i];return null}
function linNom(k){var l=linDe(k);return l?l.n:k}
function linDef(k){var l=linDe(k);return l?l.def:AREAS[0]}
function linAr(k){var l=linDe(k);return l?l.ar:[]}
/* las areas de la pestana: las suyas de siempre MAS las que de verdad trabajo
   ese dia (NOM31). Si el euro se pasa el dia en slicer, su pestana y su hoja
   impresa tienen que traer slicer, no un europeo en ceros. */
/* una linea se ve si tiene gente dada de alta o si trabajo ese dia */
function hayLin(pl,K,k){
  var g=Object.keys(pl||{}).some(function(id){
    return pl[id]&&pl[id].act!==false&&pl[id].lin===k});
  if(g)return true;
  return !!(K&&K.lin&&K.lin[k]&&K.lin[k].min>0)}
function linsVis(pl,K){
  var con=KS.filter(function(k){
    return Object.keys(pl||{}).some(function(id){
      return pl[id]&&pl[id].act!==false&&pl[id].lin===k})});
  function hrs(k){return !!(K&&K.lin&&K.lin[k]&&K.lin[k].min>0)}
  if(!con.length)return KS.filter(function(k){return k!=="emp"});
  /* una sola cuadrilla: no hay a quien prestar, se ve solo ella */
  if(con.length===1)
    return KS.filter(function(k){return con.indexOf(k)>=0||hrs(k)});
  /* varias cuadrillas: se ven todas, para poder prestarse gente */
  return KS.filter(function(k){
    return k!=="emp"||con.indexOf("emp")>=0||hrs("emp")})}
function linDeAr(A){for(var i=0;i<LINS.length;i++)
  if(LINS[i].ar.indexOf(A)>=0)return LINS[i].k; return ""}
function arsDe(K,k){var o=linAr(k).slice();
  if(K&&K.lin&&K.lin[k]&&K.lin[k].ar)Object.keys(K.lin[k].ar).forEach(function(A){
    if(o.indexOf(A)<0&&K.lin[k].ar[A]>0)o.push(A)});
  return o}

var DEMO={
  ps:["ADRIANA MARQUEZ","BENJAMIN ORTEGA","CECILIA RAMOS","DANIEL TOVAR",
      "ELENA VARGAS","FERNANDO CASTRO","GABRIELA NUNEZ","HECTOR SALAZAR",
      "IRENE DELGADO","JAVIER MONTES"],
  euro:["KARINA ESPINOZA","LEONARDO BRISENO","MARISOL AGUILAR","NESTOR CARRANZA",
        "OLIVIA ZAMORA","PATRICIO GALVAN","ROSARIO MEDINA","RAUL ESCOBEDO",
        "SOFIA VILLALOBOS","TOMAS REYNOSO"]};
/* los que siguen trabajando y todavia no traen hora de salida */
function sinCerrar(d,pl,k){
  return Object.keys(pl||{}).filter(function(id){
    if(pl[id].act===false)return false;
    if(k&&pl[id].lin!==k)return false;
    var P=(d&&d.per&&d.per[id])||{};
    return !P.falt&&P.sig&&hm(P.sal)==null}).length}
function porLlegar(d,pl,k){
  var n=0;
  Object.keys(pl||{}).forEach(function(id){
    if(pl[id].act===false||pl[id].lin===k)return;
    var P=(d&&d.per&&d.per[id])||{};
    if(P.rs&&P.rs.length)return;
    mvsDe(P).forEach(function(m){
      if(m.k===k&&hm(m.env)!=null&&hm(m.rec)==null)n++})});
  return n}
function plantillaDemo(){var q={},n=0;
  ["ps","euro"].forEach(function(k){DEMO[k].forEach(function(nm){
    n++;q["d"+(n<10?"0":"")+n]={nom:nm,lin:k,act:true,demo:true}})});
  return q}

/* intervalos -> segmentos en un marco continuo (aguanta turno de noche) */
function aSegs(rs){var out=[],cur=null;
  (rs||[]).forEach(function(r){
    var a=hm(r.de),b=hm(r.a); if(a==null||b==null)return;
    if(cur!=null){while(a<cur)a+=1440}
    var bb=b; while(bb<=a)bb+=1440;
    out.push({a:a,b:bb,ar:r.ar,sp:!!r.sp}); cur=bb});
  return out}
function arEn(segs,t){
  if(!segs||!segs.length)return "";
  var u=marco(t,segs[0].a),i;
  for(i=0;i<segs.length;i++)if(u>=segs[i].a&&u<segs[i].b&&!noAr(segs[i].ar))return segs[i].ar;
  for(i=0;i<segs.length;i++)if(!noAr(segs[i].ar))return segs[i].ar;
  return ""}
/* igual, pero respetando el paro de esa linea (para quien ya solo anda con ella) */
function arEnP(segs,t){
  if(!segs||!segs.length)return "";
  var u=marco(t,segs[0].a),i;
  for(i=0;i<segs.length;i++)if(u>=segs[i].a&&u<segs[i].b)return segs[i].ar;
  return arEn(segs,t)}
function finDe(segs){return segs&&segs.length?segs[segs.length-1].b:null}
/* por cada renglon, si su fin ya cayo en el dia siguiente */
function otroDia(rs){var out=[],cur=null;
  (rs||[]).forEach(function(r){
    var a=hm(r.de),b=hm(r.a);
    if(a==null||b==null){out.push(false);return}
    if(cur!=null){while(a<cur)a+=1440}
    var bb=b; while(bb<=a)bb+=1440;
    out.push(bb>1440); cur=bb});
  return out}
function sigDia(f){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(f||""));
  if(!m)return f;
  var d=new Date(+m[1],+m[2]-1,+m[3]); d.setDate(d.getDate()+1);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function aRengs(L){   /* el formato {ini,fin,ar,cb} de una version vieja */
  if(!L)return [];
  if(Array.isArray(L))return L;
  var a0=hm(L.ini),b0=hm(L.fin); if(a0==null||b0==null)return [];
  var bb=b0; while(bb<=a0)bb+=1440;
  var cb=(L.cb||[]).filter(function(c){return c&&hm(c.h)!=null&&c.ar})
    .map(function(c){var u=hm(c.h);while(u<a0)u+=1440;return {t:u,ar:c.ar}})
    .filter(function(c){return c.t>a0&&c.t<bb}).sort(function(x,y){return x.t-y.t});
  var out=[],cur=a0,ar=L.ar||"";
  cb.forEach(function(c){if(c.t>cur)out.push({de:mh(cur),a:mh(c.t),ar:ar});cur=c.t;ar=c.ar});
  if(bb>cur)out.push({de:mh(cur),a:mh(bb),ar:ar});
  return out}

/* ---------- PRESTAMO: lo envia el origen, lo recibe el destino ----------
   env = hora en que el origen lo mando
   rec = hora en que el destino lo recibio. Sin esto no cuenta horas alla
   dev = hora en que el destino lo regreso. Sin esto corre hasta el fin del
         horario de la linea destino                                       */
function mvN(m){
  if(!m)return null;
  if(m.env!==undefined||m.rec!==undefined||m.dev!==undefined)return m;
  return {k:m.k,env:m.de,rec:m.de,dev:m.a};   /* formato viejo */
}
function mvsDe(P){return ((P&&P.mv)||[]).map(mvN).filter(function(m){return m&&m.k})}

/* una hora propia se pega al marco de su linea, pero PUEDE SER ANTES */
function cercaDe(t,base){var u=marco(t,base); if(u-base>720)u-=1440; return u}
/* el horario de la linea, recortado o estirado al horario propio de la persona:
   unos entran antes y otros se quedan despues de que cierra la linea */
function baseDe(base,P){
  if(!base.length)return base;
  var e=hm(P&&P.ent), s=hm(P&&P.sal);
  if(e==null&&s==null)return base;
  var b0=base[0].a, f0=base[base.length-1].b;
  var a=e==null?b0:cercaDe(e,b0);
  var b=s==null?f0:cercaDe(s,f0);
  if(b<=a)return [];
  var ar0="",arF="";
  base.forEach(function(x){if(!noAr(x.ar)){if(!ar0)ar0=x.ar;arF=x.ar}});
  var out=[];
  if(a<b0)out.push({a:a,b:Math.min(b0,b),ar:ar0||base[0].ar,sp:false});
  base.forEach(function(x){
    var xa=Math.max(x.a,a), xb=Math.min(x.b,b);
    if(xb>xa)out.push({a:xa,b:xb,ar:x.ar,sp:!!x.sp})});
  if(b>f0)out.push({a:Math.max(f0,a),b:b,ar:arF||base[base.length-1].ar,sp:false});
  return out}

function diaDe(p,P,d){
  /* HORARIO PROPIO CON SUS AREAS (14/10/2026, lo pidio Miguel).
     Antes el area de una persona la daba SIEMPRE el horario de su linea, asi que
     no habia forma de ponerle Persa a uno solo cuando la cuadrilla se fue al
     Slicer — y eso dejaba al embolsado sin gasto los dias sin Persa.
     Ahora, si la persona trae sus propios renglones (P.rs), ESOS son su dia y
     mandan sobre el horario de la linea. Si no trae, todo sigue igual. */
  var propias=(P&&P.rs&&P.rs.length)?aSegs(aRengs(P.rs)):null;
  var base=(propias&&propias.length)?propias
           :baseDe(aSegs(aRengs(d.lin&&d.lin[p.lin])),P);
  var dst={}; KS.forEach(function(k){dst[k]=aSegs(aRengs(d.lin&&d.lin[k]))});
  if(!base.length)return [];
  var b0=base[0].a, finB=finDe(base);
  /* NOM54: si trae recorrido propio, ESE es su dia completo con sus areas, y
     los envios ya no le cambian el area. Antes un envio viejo (o un "enviar"
     que se le fue por error) le ganaba al recorrido y la persona se iba a otra
     area aunque el recorrido dijera otra cosa. */
  var mvs=(propias&&propias.length?[]:mvsDe(P)).map(function(m){
    var a=hm(m.rec); if(a==null)return null;      /* todavia no lo reciben */
    a=marco(a,b0);
    var b=hm(m.dev);
    if(b==null){var fd=finDe(dst[m.k]);           /* abierto: fin del destino */
      b=fd==null?finB:marco(fd,a); if(b<=a)b+=1440;
    }else{while(b<=a)b+=1440}
    if(b<=a)return null;
    return {a:a,b:b,k:m.k}}).filter(Boolean);

  var tope=finB; mvs.forEach(function(m){if(m.b>tope)tope=m.b});
  /* los cambios de area de la linea destino, dentro de la ventana del prestamo */
  function corD(m){var o=[];
    (dst[m.k]||[]).forEach(function(s){[s.a,s.b].forEach(function(x){
      var u=marco(x,m.a); if(u>m.a&&u<m.b)o.push(u)})});
    return o}
  var out=[];
  function mete(a,b,ar,lin,sp){ if(b<=a)return;
    var u=out[out.length-1];
    if(u&&u.b===a&&u.ar===ar&&u.lin===lin&&!!u.sp===!!sp)u.b=b;
    else out.push({a:a,b:b,ar:ar,lin:lin,sp:!!sp})}

  base.forEach(function(s){
    var cut={}; cut[s.a]=1; cut[s.b]=1;
    mvs.forEach(function(m){if(m.a>s.a&&m.a<s.b)cut[m.a]=1; if(m.b>s.a&&m.b<s.b)cut[m.b]=1;
      if(m.a<s.b&&m.b>s.a)corD(m).forEach(function(u){if(u>s.a&&u<s.b)cut[u]=1})});
    var cs=Object.keys(cut).map(Number).sort(function(x,y){return x-y});
    for(var i=0;i<cs.length-1;i++){
      var a=cs[i],b=cs[i+1],lin=p.lin,ar=s.ar,sp=s.sp;
      if(!noAr(s.ar))mvs.forEach(function(m){if(a>=m.a&&a<m.b){
        lin=m.k; ar=arEn(dst[m.k],a)||linDef(m.k); sp=false}});
      mete(a,b,ar,lin,sp)}});

  /* si el destino termina despues que su propia linea, esas horas tambien se
     trabajaron: se agregan al final con el area del destino */
  if(tope>finB)mvs.forEach(function(m){
    if(m.b>finB){var a0=Math.max(m.a,finB);
      var cs=[a0].concat(corD(m).filter(function(u){return u>a0&&u<m.b})).concat([m.b]);
      cs.sort(function(x,y){return x-y});
      for(var i=0;i<cs.length-1;i++)
        mete(cs[i],cs[i+1],arEnP(dst[m.k],cs[i])||linDef(m.k),m.k,false)}});
  out.sort(function(x,y){return x.a-y.a});
  return out}

/* ---------- MOTOR ---------- */
function calcula(d,pl,sup){
  var jor0=nf(sup.jornal), hex=nf(sup.hex);
  var ar={}; AREAS.forEach(function(A){ar[A]={min:0,minX:0,jor:0,ext:0,np:0,gente:[],md:false,pr:{}}});
  var lin={}; KS.forEach(function(k){lin[k]={min:0,jor:0,ext:0,np:0,ar:{}}});
  var pers={}, tot={np:0,min:0,minX:0,jor:0,ext:0,pr:{}};

  Object.keys(pl||{}).forEach(function(pid){
    var p=pl[pid]; if(!p||p.act===false||KS.indexOf(p.lin)<0)return;
    var P=(d.per&&d.per[pid])||{};
    var r={pid:pid,nom:p.nom||"",lin:p.lin,falt:!!P.falt,segs:[],pl:{},ar:{},pr:{},
           min:0,minX:0,jor:0,ext:0,mvs:mvsDe(P)};
    if(!r.falt){
      r.segs=diaDe(p,P,d);
      /* un paro pagado se carga al area en la que venia la linea; si el dia
         arranca parado, a la primera area real que aparezca */
      var ult="",prim="";
      r.segs.forEach(function(s){if(!noAr(s.ar)&&AREAS.indexOf(s.ar)>=0&&!prim)prim=s.ar});
      r.segs.forEach(function(s){
        var A=s.ar, dd=s.b-s.a, mot="";
        if(esParoM(A)){
          if(s.sp)return;                 /* marcado sin pago: no cuenta ni se paga */
          mot=A; A=ult||prim; if(!A)return;
        } else if(esParo(A)||AREAS.indexOf(A)<0) return;
        else ult=A;
        if(s.b>1440)ar[A].md=true;
        var L=r.pl[s.lin]||(r.pl[s.lin]={ar:{},min:0,jor:0,ext:0});
        L.ar[A]=(L.ar[A]||0)+dd; L.min+=dd;
        r.ar[A]=(r.ar[A]||0)+dd; r.min+=dd;
        if(mot){ar[A].pr[mot]=(ar[A].pr[mot]||0)+dd; r.pr[mot]=(r.pr[mot]||0)+dd;
          tot.pr[mot]=(tot.pr[mot]||0)+dd}})}
    if(r.min>0){
      var jp=nf(p.jor)||jor0;
      r.minX=Math.max(0,r.min-480); r.jor=jp; r.ext=(r.minX/60)*hex;
      /* El pedazo que le toca a cada area sale del PORCENTAJE de minutos que
         anduvo ahi, igual para el jornal y para las extras. Por eso un pedazo
         puede salir en 4.40 o en 1.10 aunque todo se haya capturado en medias
         horas: lo que importa es que los pedazos SUMEN su dia completo.    */
      Object.keys(r.ar).forEach(function(A){
        var q=r.ar[A]/r.min, j=jp*q, e=r.ext*q, mx=r.minX*q;
        ar[A].min+=r.ar[A]; ar[A].minX+=mx; ar[A].jor+=j; ar[A].ext+=e; ar[A].np++;
        ar[A].gente.push({pid:pid,nom:r.nom,lin:r.lin,min:r.ar[A],minX:mx,jor:j,ext:e})});
      Object.keys(r.pl).forEach(function(k){var L=r.pl[k];
        Object.keys(L.ar).forEach(function(A){var q=L.ar[A]/r.min;
          L.jor+=jp*q; L.ext+=r.ext*q;
          /* en que areas anduvo ESTA linea: la euro puede pasarse el dia en
             slicer, y el resumen y la impresion de su pestana lo tienen que ver */
          lin[k].ar[A]=(lin[k].ar[A]||0)+L.ar[A]});
        lin[k].min+=L.min; lin[k].jor+=L.jor; lin[k].ext+=L.ext; lin[k].np++});
      tot.np++; tot.min+=r.min; tot.minX+=r.minX; tot.jor+=r.jor; tot.ext+=r.ext}
    pers[pid]=r});

  AREAS.forEach(function(A){ar[A].gente.sort(function(a,b){
    return (a.nom||"").localeCompare(b.nom||"")})});
  var sj=0,sx=0; AREAS.forEach(function(A){sj+=ar[A].jor;sx+=ar[A].ext});
  tot.cuadra=Math.abs(sj-tot.jor)<0.01&&Math.abs(sx-tot.ext)<0.01;
  return {ar:ar,lin:lin,pers:pers,tot:tot}}

function diaNuevo(f){var l={};KS.forEach(function(k){l[k]=[]});
  return {f:f,lin:l,per:{},cer:{}}}
function sanea(v,f){var d=diaNuevo(f);
  if(v&&v.lin)KS.forEach(function(k){if(v.lin[k])d.lin[k]=aRengs(v.lin[k]).slice()});
  if(v&&v.per)d.per=v.per; if(v&&v.cer)d.cer=v.cer; return d}
function limpiaDia(d){var o={f:d.f,lin:{},per:{},cer:d.cer||{}};
  KS.forEach(function(k){o.lin[k]=aRengs(d.lin[k]).filter(function(r){
    return hm(r.de)!=null&&hm(r.a)!=null})});
  Object.keys(d.per||{}).forEach(function(pid){var P=d.per[pid],n={};
    if(P.falt)n.falt=true;
    if(hm(P.ent)!=null)n.ent=P.ent;
    if(hm(P.sal)!=null)n.sal=P.sal;
    if(P.sig&&hm(P.sal)==null)n.sig=true;
    var mv=mvsDe(P).filter(function(m){return hm(m.env)!=null});
    if(mv.length)n.mv=mv;
    /* EL RECORRIDO PROPIO TAMBIEN SE GUARDA (14/10/2026).
       Esta funcion es una lista blanca: lo que no se nombre aqui se TIRA al
       guardar. Cuando se agrego el recorrido propio se olvido meterlo, asi que
       se capturaba, se veia en pantalla y desaparecia al guardar. */
    var rsP=(P.rs||[]).filter(function(r){return hm(r.de)!=null&&hm(r.a)!=null});
    if(rsP.length)n.rs=rsP;
    if(Object.keys(n).length)o.per[pid]=n});
  return o}

/* ---------- campo de hora ---------- */
function Hora(p){
  var [txt,setTxt]=uS(null);
  var val=txt!==null?txt:(p.v||"");
  var malo=txt!==null&&txt!==""&&parseHora(txt)===null;
  function cierra(){if(txt===null)return;var q=parseHora(txt);setTxt(null);
    if(q)q=redHora(q);
    if(q!==null&&q!==(p.v||""))p.on(q)}
  if(p.ro)return <input type="text" readOnly className="hr ro" value={p.v||"--:--"}/>;
  return <input type="text" inputMode="numeric" maxLength="5" placeholder="--:--"
    className="hr" value={val}
    style={malo?{borderColor:"#8a3030",color:"#f09a9a"}:null}
    onChange={function(e){setTxt(e.target.value)}}
    onBlur={cierra}
    onKeyDown={function(e){if(e.key==="Enter"){cierra();e.target.blur()}}}/>}

/* ---------- horario de la linea ---------- */
function Horario(p){
  var rs=p.rs||[],set=p.set,def=p.def,cer=!!p.cer;
  var view=rs.length?rs:[{de:"",a:"",ar:def}];
  function up(i,o){var q=rs.slice();
    while(q.length<=i)q.push({de:"",a:"",ar:def});
    q[i]=Object.assign({},q[i],o);set(q)}
  var nd=otroDia(view);
  var por={},t=0,pa={},pr={},tpr=0;
  aSegs(view).forEach(function(s){var dd=s.b-s.a;
    if(esParoM(s.ar)){var k=s.ar.replace("Paro ","");
      if(s.sp)k+=" (sin pago)";
      pr[k]=(pr[k]||0)+dd; if(!s.sp)tpr+=dd; return}
    if(esParo(s.ar)){var nn=s.ar==="Comida / cena"?"Comida":s.ar;
      pa[nn]=(pa[nn]||0)+dd;return}
    if(AREAS.indexOf(s.ar)<0)return;

function deHist(h){

  return {min:h.min,minX:h.mx||0,jor:h.jor,ext:h.ext,np:h.np,pr:h.pr||{},

              return [

/* ---------- la raya de la semana (NOM35) ---------- */
/* La nomina se cierra el MIERCOLES en la manana. Ese dia se paga:
     ASISTENCIA  de viernes a jueves  (miercoles y jueves van por adelantado)
     EXTRAS      de miercoles a martes (las de miercoles y jueves de esta
                 semana no se saben todavia, se pagan en la raya siguiente)
   Son 9 dias en la hoja: los 2 primeros solo traen extras, los 2 ultimos
   solo asistencia, y los 5 de en medio traen las dos cosas.               */
function isoDe(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+
  "-"+("0"+d.getDate()).slice(-2)}
function masDias(f,n){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(f||""));
  if(!m)return f;
  var d=new Date(+m[1],+m[2]-1,+m[3]);d.setDate(d.getDate()+n);return isoDe(d)}
function cierreDe(f){   /* el miercoles en que se cierra esa raya */
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(f||""));
  var d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date();
  d.setDate(d.getDate()+((3-d.getDay()+7)%7));
  return isoDe(d)}
function diasRaya(f){var c=cierreDe(f),o=[];
  for(var i=-7;i<=1;i++)o.push(masDias(c,i));
  return o}
var iEXT=[0,1,2,3,4,5,6];      /* miercoles a martes: cuentan extras */
var iASI=[2,3,4,5,6,7,8];      /* viernes a jueves:  cuentan asistencia */

/* lo capturado de cada quien en esos 9 dias: {nom,lin,d:{fecha:{a,x,sup}}} */
function raya(hist,dias,f,K,pl){
  var P={};
  function mete(nom,lin,ff,mx){
    var r=P[nom]||(P[nom]={nom:nom,lin:lin||"",d:{}});
    if(!r.lin&&lin)r.lin=lin;
    var c=r.d[ff]||(r.d[ff]={a:false,x:0,sup:false});
    c.a=true; c.x+=mx||0}
  dias.forEach(function(ff){
    if(K&&ff===f){                       /* el dia que trae abierto, en vivo */
      var viv=[];
      Object.keys(K.pers||{}).forEach(function(pid){var r=K.pers[pid];
        if(r.min>0||r.jor>0)viv.push(r)});
      if(viv.length){viv.forEach(function(r){mete(r.nom,r.lin,ff,r.minX)});return}}
    AREAS.forEach(function(A){
      var h=hist[A]&&hist[A][ff]; if(!h||!h.g)return;
      h.g.forEach(function(x){mete(x.n,x.l,ff,x.x||0)})})});
  var g=Object.keys(P).map(function(n){return P[n]});
  /* el miercoles y el jueves van por adelantado: todavia no estan capturados,
     asi que se le suponen a quien si vino en la semana */
  var act={};Object.keys(pl||{}).forEach(function(id){
    if(pl[id]&&pl[id].act!==false)act[sinAc(pl[id].nom)]=true});
  g.forEach(function(r){
    var vino=false;
    [2,3,4,5,6].forEach(function(i){if(r.d[dias[i]])vino=true});
    if(!vino||!act[sinAc(r.nom)])return;
    [7,8].forEach(function(i){var ff=dias[i];
      if(!r.d[ff])r.d[ff]={a:true,x:0,sup:true}})});
  /* LO QUE SE PAGA VA REDONDEADO (NOM36): las extras de cada quien, por dia,
     se cierran al mismo paso que el redondeo de captura. Asi los dias que se
     capturaron a minutos sueltos tambien salen en horas y medias horas.
     El gasto por area se queda exacto, porque eso es costo, no raya.       */
  g.forEach(function(r){Object.keys(r.d).forEach(function(ff){
    r.d[ff].x=redMin(r.d[ff].x)})});
  g.sort(function(a,b){return sinAc(a.nom)<sinAc(b.nom)?-1:
    sinAc(a.nom)>sinAc(b.nom)?1:0});
  return g}
function sumaRaya(r,dias){
  var na=0,mx=0;
  iASI.forEach(function(i){var c=r.d[dias[i]];if(c&&c.a)na++});
  iEXT.forEach(function(i){var c=r.d[dias[i]];if(c)mx+=c.x});
  return {na:na,mx:mx}}

function Cel(p){
  var c=p.c, ex=p.ex, as=p.as;
  var vA=as&&c&&c.a, vT=ex&&c&&c.x>0;
  if(!vA&&!vT)return <span className="mut">&mdash;</span>;
  return <span>
    {vA&&<b className={c.sup?"asi sup":"asi"}>A</b>}
    {vT&&<b className="te">{(vA?" ":"")+"TE "+hdec(c.x)}</b>}</span>}

function Semana(p){
  var dias=diasRaya(p.f), g=raya(p.hist,dias,p.f,p.K,p.pl);
  var cie=cierreDe(p.f);
  var T={na:0,mx:0};
  g.forEach(function(r){var s=sumaRaya(r,dias);T.na+=s.na;T.mx+=s.mx});
  function cls(i){return i===2||i===7?"corte":""}
  return (
  <div className="card">
    <h3>Asistencia y extras por persona
      <span className="mut" style={{fontWeight:400,marginLeft:10,fontSize:13}}>
        cierre {fCorto(cie)}{"  \u00b7  "}asistencia {fCorto(dias[2])} al {fCorto(dias[8])}
        {"  ·  "}extras {fCorto(dias[0])} al {fCorto(dias[6])}</span>
      <button className="gh sm" style={{marginLeft:10}}
        onClick={function(){p.ir(masDias(p.f,-7))}}>&laquo;</button>
      <button className="gh sm" style={{marginLeft:5}}
        onClick={function(){p.ir(masDias(p.f,7))}}>&raquo;</button>
    </h3>
    {!g.length&&<div className="mut" style={{marginTop:8}}>Nada guardado esta semana.</div>}
    {!!g.length&&<table style={{marginTop:9}}>
      <thead><tr><th style={{width:30}}>#</th><th>Nombre</th>
        {dias.map(function(ff,i){return <th key={ff} className={"num "+cls(i)}
          style={ff===p.f?{color:"var(--ac2)"}:null}>{fCorto(ff)}</th>})}
        <th className="num corte">A</th><th className="num">TE</th></tr></thead>
      <tbody>
        {g.map(function(r,i){var s=sumaRaya(r,dias);return (
          <tr key={r.nom}>
            <td className="num dt">{i+1}</td>
            <td>{r.nom}</td>
            {dias.map(function(ff,j){return <td key={ff} className={"num "+cls(j)}>
              <Cel c={r.d[ff]} ex={iEXT.indexOf(j)>=0} as={iASI.indexOf(j)>=0}/></td>})}
            <td className="num corte"><b className="asi">{s.na}</b></td>
            <td className="num"><b className="te">{hdec(s.mx)}</b></td>
          </tr>)})}
        <tr className="tot2x"><td colSpan="2"><b>TOTAL</b></td>
          {dias.map(function(ff,j){var n=0,x=0;
            g.forEach(function(r){var c=r.d[ff];if(!c)return;
              if(c.a&&iASI.indexOf(j)>=0)n++;
              if(iEXT.indexOf(j)>=0)x+=c.x});
            return <td key={ff} className={"num "+cls(j)}>{(n||x)?<span>
              {n>0&&<b className="asi">{n}</b>}
              {x>0&&<b className="te">{(n>0?" ":"")+hdec(x)}</b>}
              </span>:<span className="mut">&mdash;</span>}</td>})}
          <td className="num corte"><b className="asi">{T.na}</b></td>
          <td className="num"><b className="te">{hdec(T.mx)}</b></td></tr>
      </tbody></table>}
  </div>)}

function HojaSem(p){
  var dias=diasRaya(p.f), g=raya(p.hist,dias,p.f,p.K,p.pl);
  var cie=cierreDe(p.f);
  var T={na:0,mx:0};
  g.forEach(function(r){var s=sumaRaya(r,dias);T.na+=s.na;T.mx+=s.mx});

          "   ·   Extras "+fLarga(dias[0])+" al "+fLarga(dias[6]);

  function cls(i){return i===2||i===7?"n corte":"n"}
  return (
  <div className="hoja" style={{"--ar":"#45b649"}}>
    <div className="enc">
      <Sello id="hsem" s={160} cls="selimp"/>
      <div className="enctx">

        <div className="fch">{ran}</div>
      </div>
      <div className="tar">

      </div>

          <th className="n corte">A</th><th className="n">TE</th></tr>
      </thead>
      <tbody>
        {g.map(function(r,i){var s=sumaRaya(r,dias);return <tr key={r.nom}>
          <td className="n">{i+1}</td>
          <td className="nm">{r.nom}</td>
          {dias.map(function(ff,j){var c=r.d[ff];
            var vA=iASI.indexOf(j)>=0&&c&&c.a, vT=iEXT.indexOf(j)>=0&&c&&c.x>0;
            return <td key={ff} className={cls(j)}>{!vA&&!vT?"—":
              <span>{vA&&<b>A</b>}{vT&&<b>{(vA?"  ":"")+"TE "+hdec(c.x)}</b>}</span>}</td>})}
          <td className="n corte"><b>{s.na}</b></td>
          <td className="n"><b>{hdec(s.mx)}</b></td></tr>})}
        {!g.length&&<tr><td colSpan={dias.length+4}>Sin movimiento esta semana.</td></tr>}
      </tbody>
      <tfoot>
        <tr className="tt"><td colSpan="2">TOTAL DE LA SEMANA</td>
          {dias.map(function(ff,j){var n=0,x=0;
            g.forEach(function(r){var c=r.d[ff];if(!c)return;
              if(c.a&&iASI.indexOf(j)>=0)n++;
              if(iEXT.indexOf(j)>=0)x+=c.x});
            return <td key={ff} className={cls(j)}>{(n||x)?
              ((n>0?String(n):"")+(x>0?(n>0?"  ":"")+hdec(x):"")):"—"}</td>})}
          <td className="n corte">{T.na}</td>
          <td className="n">{hdec(T.mx)}</td></tr>
      </tfoot>
    </table>
    <div className="fir"><div>Elabor&oacute;</div><div>Revis&oacute;</div><div>Autoriz&oacute;</div></div>
    <div className="pie">{tit}</div>

/* ---------- HORAS DE LA SEMANA (NOM40) ---------- */
/* Un cuadro por area. Abajo la gente que metio horas ahi, a lo ancho los dias.
   El renglon de cada quien suma su semana en esa area; la columna de cada dia
   suma lo que metio el area ese dia.                                        */
function diasSem(f){                 /* viernes a jueves, la semana que se paga */
  var c=cierreDe(f),o=[];
  for(var i=-5;i<=1;i++)o.push(masDias(c,i));
  return o}

/* {ar:{area:{nombre:{nom,lin,d:{fecha:{m,x}}}}}, vino:{nombre:{fecha:true}}} */
function horasSem(hist,dias,f,K){
  var P={}, V={};
  function mete(A,nom,lin,ff,m,x){
    var a=P[A]||(P[A]={}), r=a[nom]||(a[nom]={nom:nom,lin:lin||"",d:{}});
    if(!r.lin&&lin)r.lin=lin;
    var c=r.d[ff]||(r.d[ff]={m:0,x:0});
    c.m+=m||0; c.x+=x||0;
    if(m>0){var v=V[nom]||(V[nom]={}); v[ff]=true}}
  dias.forEach(function(ff){
    if(K&&ff===f){                   /* el dia abierto, en vivo */
      var hay=false;
      AREAS.forEach(function(A){if(K.ar[A]&&K.ar[A].min>0)hay=true});
      if(hay){
        AREAS.forEach(function(A){
          (K.ar[A].gente||[]).forEach(function(x){
            mete(A,x.nom,x.lin,ff,x.min,x.minX)})});
        return}}
    AREAS.forEach(function(A){
      var h=hist[A]&&hist[A][ff]; if(!h||!h.g)return;

   nada mas. Ayer no hubo europeo y me esta saliendo europeo."

/* ===================  ACUMULADO DE LA SEMANA  ===================
   [stated] Miguel, 15/10/2026: "una cosa es las que hizo el miercoles, me las
   vas a dar. Pero quiero el acumulado. En una parte que vaya todo el acumulado,
   como va el comportamiento en la semana. Porque es el que voy a imprimir al
   final y lo voy a pasar a RH."
   Siempre va sobre la SEMANA QUE SE PAGA (viernes a jueves), aunque la pantalla
   este viendo un solo dia: el cuadro de abajo es el dia, este es el acumulado.
   Cada celda trae las HORAS del dia y, si hubo, las extras abajo. */
function filasAcum(hist,f,K){
  var dias=diasSem(f), H=horasSem(hist,dias,f,K), P=H.ar;
  var ars=AREAS.filter(function(A){return Object.keys(P[A]||{}).length});
  var filas=ars.map(function(A){
    var g=genteDe(P,A), d={}, T={m:0,x:0};
    dias.forEach(function(ff){var c=sumaCol(g,ff); d[ff]=c; T.m+=c.m; T.x+=c.x});
    return {A:A, np:g.length, d:d, T:T};
  });
  var tot={d:{},T:{m:0,x:0},np:0};
  dias.forEach(function(ff){var m=0,x=0;
    filas.forEach(function(r){m+=r.d[ff].m; x+=r.d[ff].x});
    tot.d[ff]={m:m,x:x}; tot.T.m+=m; tot.T.x+=x});
  filas.forEach(function(r){if(r.np>tot.np)tot.np=tot.np});
  return {dias:dias, filas:filas, tot:tot};
}

      <path d="M20 76.8 C31 75.6 42 78.6 50 84.2 C58 78.6 69 75.6 80 76.8" strokeWidth="2.7"/>
    </g>
  </g>
  <circle cx="50" cy="50" r="27.4" fill="none" stroke="#45b649" strokeWidth="1.6"/>
  <g fill="#ffffff" fontFamily="Arial,Helvetica,sans-serif" fontWeight="bold">
    <text textAnchor="middle" fontSize="11.2" letterSpacing="0.35"><textPath href={"#"+ITop} startOffset="50%">PARRAS VALLEY</textPath></text>
    <text textAnchor="middle" fontSize="5" letterSpacing="0.4"><textPath href={"#"+IBot} startOffset="50%">FEEDING THE WORLD IN A SUPERIOR WAY</textPath></text>
  </g>

</g>

function Hoja(p){
  var A=p.A,f=p.f,sup=p.sup,R=p.R;
  if(!R)return null;
  var g=R.gente||[];
  var fch=fLarga(f)+(R.md?"  \u2192  "+fLarga(sigDia(f)):"");
  /* HOJA PARA RH, SIN DINERO (NOM57, 15/10/2026).
     [stated] Miguel: "en los formatos que voy a entregar a RH no quiero que
     lleve sueldos, porque los sueldos de algunos son diferentes... nomas vas a
     poner asistencia y tantas horas. Pero en lo que me va a quedar a mi, de ahi
     si quiero que lleve."
     El dinero NO se deja de calcular ni de guardar: sigue yendo a Firebase
     igual, y de ahi lo siguen leyendo gastos y los KPIs. Lo unico que cambia es
     el papel. */
  var sin=!!p.sin;
  var nc=sin?6:9;
  var tit=(sin?"Asistencia y horas \u2014 ":"N\u00f3mina \u2014 ")+A.toUpperCase()+"  \u00b7  "+fch;
  return (
  <div className="hoja" style={{"--ar":colAr(A)}}>
    <div className="enc">
      <Sello id={"h"+A} s={160} cls="selimp"/>
      <div className="enctx">
        <div className="emp">Parras Valley Tomatoes</div>
        <h1>{sin?"Asistencia y horas":"N\u00f3mina"} &mdash; {A}</h1>
        <div className="fch">{fch}</div>
      </div>
      <div className="tar">
        {!sin&&<div>Sueldo del dia <b>{mny(sup.jornal)}</b></div>}
        {!sin&&<div>Hora extra <b>{mny(sup.hex)}</b></div>}
        <div>{R.np} personas</div>
        <div>{hdec(R.min)} horas</div>
        {sin&&<div>{hdec(R.minX||0)} h extra</div>}
      </div>
    </div>
    <table>
      <thead>
        <tr className="hcab"><th colSpan={nc}>{tit}</th></tr>
        <tr><th style={{width:"26px"}}>#</th><th>Nombre</th><th>Plantilla</th>
          <th className="n">Normales</th><th className="n">Extra</th>
          <th className="n">Horas</th>
          {!sin&&<th className="n">Jornal</th>}
          {!sin&&<th className="n">Extras</th>}
          {!sin&&<th className="n">Total</th>}</tr>
      </thead>
      <tbody>
        {g.map(function(x,i){return <tr key={x.pid}>
          <td className="n">{i+1}</td>
          <td className="nm">{x.nom}</td>
          <td>{linNom(x.lin)}</td>
          <td className="n">{hdec(x.min-(x.minX||0))}</td>
          <td className="n">{x.minX?hdec(x.minX):"\u2014"}</td>
          <td className="n"><b>{hdec(x.min)}</b></td>
          {!sin&&<td className="n">{mny(x.jor)}</td>}
          {!sin&&<td className="n">{mny(x.ext)}</td>}
          {!sin&&<td className="n"><b>{mny(x.jor+x.ext)}</b></td>}</tr>})}
        {!g.length&&<tr><td colSpan={nc}>Sin movimiento este dia.</td></tr>}
      </tbody>
      <tfoot>
        {Object.keys(R.pr||{}).length>0&&<tr className="pr"><td colSpan={nc}>
          PAROS: {Object.keys(R.pr).map(function(m){
            return m.replace("Paro ","")+" "+hdec(R.pr[m])+" h"}).join("  \u00b7  ")}
          {"  \u00b7  total "+hdec(Object.keys(R.pr).reduce(function(x,m){
            return x+R.pr[m]},0))+" h"}</td></tr>}
        <tr className="tt"><td colSpan="3">TOTAL {A.toUpperCase()}</td>
          <td className="n">{hdec(R.min-(R.minX||0))}</td>
          <td className="n">{hdec(R.minX||0)}</td>
          <td className="n">{hdec(R.min)}</td>
          {!sin&&<td className="n">{mny(R.jor)}</td>}
          {!sin&&<td className="n">{mny(R.ext)}</td>}
          {!sin&&<td className="n">{mny(R.jor+R.ext)}</td>}</tr>
      </tfoot>
    </table>
    <div className="fir"><div>Elabor&oacute;</div><div>Revis&oacute;</div><div>Autoriz&oacute;</div></div>
    <div className="pie">{tit}{sin?"  \u00b7  solo asistencia y horas, sin importes":""}</div>
  </div>)}

/* ---------- APP ---------- */
function App(){
  var [tab,setTab]=uS("ps");
  var [k,setK]=uS("ps");
  var [f,setF]=uS(hoyISO());
  var [pl,setPl0]=uS({});
  var [sup,setSup0]=uS({jornal:"",hex:""});
  var [d,setD]=uS(null);
  var [hist,setHist]=uS({});
  var [car,setCar]=uS(true);
  var [est,setEst]=uS("");
  var [impAr,setImpAr]=uS(null);
  var [modoHrs,setModoHrs]=uS("dia");   /* "dia" | "sem" en la pestana Por area */
  var [sinDin,setSinDin]=uS(false);     /* true = la hoja sale sin importes, para RH */
  var [impH,setImpH]=uS(null);
  var tmr=uR(null),prim=uR(true),impRef=uR(null);

  uE(function(){Promise.all([fget("nomina-plantilla-v1"),fget("nomina-sup-v1"),fget("nomina-hist-v1")])
    .then(function(v){
      var q=v[0]||{};
      Object.keys(q).forEach(function(id){
        if(!q[id].lin&&q[id].lins){var ks=KS.filter(function(x){return q[id].lins[x]});
          q[id]=Object.assign({},q[id],{lin:ks[0]||"ps"})}});
      if(!Object.keys(q).length){q=plantillaDemo();fput("nomina-plantilla-v1",q)}
      setPl0(q);
      if(v[1]){var S=Object.assign({jornal:"",hex:""},v[1]);
        if(!S.hex&&S.fex)S.hex=String(Math.round(nf(S.jornal)/8*nf(S.fex)*100)/100);
        setSup0(S)}
      setHist(v[2]||{})})},[]);
  uE(function(){var vivo=true;setCar(true);prim.current=true;
    fget("nomina-dias-v1/"+f).then(function(v){if(!vivo)return;
      setD(sanea(v,f));setCar(false);setEst("")});
    return function(){vivo=false}},[f]);
  uE(function(){
    if(!d||car)return;
    if(prim.current){prim.current=false;return}
    setEst("guardando...");
    if(tmr.current)clearTimeout(tmr.current);
    tmr.current=setTimeout(function(){guarda(true)},1400);
    return function(){if(tmr.current)clearTimeout(tmr.current)}},[d]);
  uE(function(){   /* respaldo: dias viejos sin detalle, se carga el dia y se imprime */
    if(!impRef.current||car||!d||d.f!==impRef.current.f)return;
    var A=impRef.current.A; impRef.current=null;
    setImpAr(A); setTimeout(function(){window.print();setImpAr(null)},400)},[car,d]);

  function setPl(q){setPl0(q);fput("nomina-plantilla-v1",q)}
  function setSup(q){setSup0(q);fput("nomina-sup-v1",q)}
  var K=uM(function(){return d?calcula(d,pl,sup):null},[d,pl,sup]);
  try{window.__nom={calcula:calcula,diaDe:diaDe,aSegs:aSegs,d:d,pl:pl,sup:sup,K:K,hist:hist}}catch(e){}

  function imprime(ff,A){
    var h=hist[A]&&hist[A][ff];
    if(h&&h.g&&h.g.length){            /* ya trae los nombres guardados */
      setImpH({A:A,f:ff,R:deHist(h)});
      setTimeout(function(){window.print();setImpH(null)},150);return}
    if(ff===f&&d&&!car){setImpAr(A);
      setTimeout(function(){window.print();setImpAr(null)},150);return}
    impRef.current={f:ff,A:A}; setF(ff)}

  /* borrar un renglon del historial (12/10/2026, para sus pruebas) */
  function borraHist(A,ff){
    var hs=Object.assign({},hist);
    if(hs[A]){hs[A]=Object.assign({},hs[A]);delete hs[A][ff];
      if(!Object.keys(hs[A]).length)delete hs[A];}
    setHist(hs);
    fput("nomina-hist-v1/"+A+"/"+ff,null).then(function(ok){
      var h=new Date();
      setEst((ok?"borrado ":"NO se borro ")
        +("0"+h.getHours()).slice(-2)+":"+("0"+h.getMinutes()).slice(-2))})}

  /* al historial solo va lo que YA CERRO. Un area puede traer horas de dos
     plantillas, asi que se esperan TODAS las lineas que le pusieron horas.
     Mientras alguna siga abierta, ese dia no existe en el historial; al
     cerrarla entra con los numeros finales, y si la reabren se vuelve a salir */
  function cerradaA(A){
    var ks=KS.filter(function(k){
      return K.lin[k]&&K.lin[k].ar&&K.lin[k].ar[A]>0});
    if(!ks.length)return false;
    return ks.every(function(k){return !!(d.cer&&d.cer[k])})}

  function guarda(auto){
    if(!d||!K)return;
    var hs=Object.assign({},hist),ps=[fput("nomina-dias-v1/"+f,limpiaDia(d))];
    AREAS.forEach(function(A){var R=K.ar[A];
      if(R.min>0&&cerradaA(A)){var pr0={},hp=false;
        Object.keys(R.pr||{}).forEach(function(m){pr0[m]=Math.round(R.pr[m]);hp=true});
        var reg={np:R.np,min:Math.round(R.min),mx:Math.round(R.minX),md:R.md?1:0,
        jor:Math.round(R.jor*100)/100,ext:Math.round(R.ext*100)/100,
        pr:hp?pr0:null,
        /* el detalle con nombres, para poder imprimir la nomina desde el
           historial sin volver a armar el dia */
        g:R.gente.map(function(x){return {n:x.nom,l:x.lin,m:Math.round(x.min),
          x:Math.round(x.minX),
          j:Math.round(x.jor*100)/100,e:Math.round(x.ext*100)/100}})};
        hs[A]=Object.assign({},hs[A]);hs[A][f]=reg;
        ps.push(fput("nomina-hist-v1/"+A+"/"+f,reg))}
      else if(hs[A]&&hs[A][f]!==undefined){
        hs[A]=Object.assign({},hs[A]);delete hs[A][f];
        if(!Object.keys(hs[A]).length)delete hs[A];
        ps.push(fput("nomina-hist-v1/"+A+"/"+f,null))}});
    setHist(hs);
    Promise.all(ps).then(function(r){var ok=r.every(Boolean),h=new Date();
      setEst((ok?"guardado ":"NO se guardo ")
        +("0"+h.getHours()).slice(-2)+":"+("0"+h.getMinutes()).slice(-2))})}

  var vis=linsVis(pl,K);
  /* si la pestana en la que esta se escondio, se brinca a la primera que si se ve */
  if(vis.indexOf(k)<0&&tab!=="hist"&&tab!=="per"&&tab!=="hrs"){
    setTimeout(function(){setK(vis[0]);setTab(vis[0])},0)}
  /* NOM55: a la impresora NO se manda un area que ese dia no trabajo. Antes la
     pestana Persa/Slicer sacaba las dos hojas aunque el Slicer no hubiera
     corrido, y a RH le llegaban hojas en ceros que nomas revuelven. */
  var hojas=impAr?[impAr]
    :arsDe(K,k).filter(function(A){return K&&K.ar[A]&&K.ar[A].min>0});
  var miAr=arsDe(K,k), tA={min:0,jor:0,ext:0};
  if(K)miAr.forEach(function(A){tA.min+=K.ar[A].min;tA.jor+=K.ar[A].jor;tA.ext+=K.ar[A].ext});

  return (
  <div>
    <div className="bar noimp">
      <div className="tabs">
        <Sello id="bar" s={64} cls="selbar"/>
        <span className="marca">N&oacute;mina</span>
        <span title="version instalada" style={{fontSize:10,opacity:.65,alignSelf:"center",
          cursor:"pointer",letterSpacing:.5}}
          onClick={function(){try{sessionStorage.removeItem("nom-rec")}catch(e){};
            location.reload(true)}}>{BUILD}</span>
        {LINS.filter(function(l){return vis.indexOf(l.k)>=0}).map(function(l){
          var n=d?porLlegar(d,pl,l.k):0;
          return <button key={l.k} className={tab===l.k?"on":""}
          onClick={function(){setTab(l.k);setK(l.k)}}>
          <span className="row" style={{gap:7,justifyContent:"center"}}>{l.n}
          {n>0&&<span className="pill rj">{n} por recibir</span>}</span>
          <Barra ar={l.todas?AREAS:l.ar}/>
          </button>})}
        <div style={{width:14}}/>
        <button className={tab==="hrs"?"on":""}
          onClick={function(){setTab("hrs")}}>Por area</button>
        <button className={tab==="per"?"on":""}
          onClick={function(){setTab("per")}}>Por persona</button>
        <button className={tab==="hist"?"on":""}
          onClick={function(){setTab("hist")}}>Historial</button>
      </div>
      {tab!=="hist"&&<div className="row" style={{gap:16,alignItems:"flex-end"}}>
        <div className="fld"><div className="lbl2">Fecha</div>
          <div className="row" style={{gap:5}}>
            <button className="gh sm" onClick={function(){setF(masDias(f,-1))}}>&laquo;</button>
            <input type="date" value={f} onChange={function(e){setF(e.target.value)}}/>
            <button className="gh sm" onClick={function(){setF(masDias(f,1))}}>&raquo;</button>
            {f!==hoyISO()&&<button className="gh sm"
              onClick={function(){setF(hoyISO())}}>hoy</button>}</div></div>
        <div className="fld"><div className="lbl2">Sueldo</div>
          <div className="row" style={{gap:4}}><span className="mut">$</span>
            <input className="num" style={{width:84}} value={sup.jornal} placeholder="360"
              onChange={function(e){setSup(Object.assign({},sup,{jornal:e.target.value}))}}/></div></div>
        <div className="fld"><div className="lbl2">Extra</div>
          <div className="row" style={{gap:4}}><span className="mut">$</span>
            <input className="num" style={{width:84}} value={sup.hex} placeholder="50"
              onChange={function(e){setSup(Object.assign({},sup,{hex:e.target.value}))}}/></div></div>
        <div style={{flex:1}}/>
        <button className="pri" onClick={function(){guarda(false)}}>Guardar</button>
        <button className={sinDin?"on":"gh"} title="la hoja de nomina sale sin sueldos"
          onClick={function(){setSinDin(!sinDin)}}>
          {sinDin?"sin $ (RH)":"con $"}</button>
        <button onClick={function(){window.print()}}>Imprimir</button>
        {est&&<span className={"pill "+(est.indexOf("NO")===0?"bad":
          (est.indexOf("guardando")===0?"am":"ok"))}
          style={{padding:"6px 12px",fontSize:12}}>{est}</span>}
      </div>}
    </div>
    <div className="wrap noimp">
      {car&&tab!=="hist"&&<div className="card mut">Cargando...</div>}
      {tab==="hist"&&<Historial hist={hist} imprime={imprime} borra={borraHist} est={est}
        abrir={function(ff,A){var k2=linDeAr(A)||k;setF(ff);setK(k2);setTab(k2)}}/>}
      {tab==="hrs"&&<Horas f={f} hist={hist} K={car?null:K} ir={setF}
        modo={modoHrs} setModo={setModoHrs}/>}
      {tab==="per"&&<Semana f={f} hist={hist} K={car?null:K} pl={pl} ir={setF}/>}
      {tab!=="hist"&&tab!=="per"&&tab!=="hrs"&&!car&&d&&K&&
        <Panel k={k} d={d} setD={setD} pl={pl} setPl={setPl} K={K}/>}
    </div>
    {impH&&<div id="imp"><Hoja A={impH.A} f={impH.f} sup={sup} R={impH.R} sin={sinDin}/></div>}
    {!impH&&tab==="hrs"&&<div id="imp"><HojaHrs f={f} hist={hist} K={car?null:K} modo={modoHrs}/></div>}
    {!impH&&tab==="per"&&<div id="imp"><HojaSem f={f} hist={hist} K={car?null:K} pl={pl}/></div>}
    {!impH&&!car&&d&&K&&tab!=="per"&&tab!=="hrs"&&<div id="imp">{hojas.map(function(A){
      return <Hoja key={A} A={A} f={f} sup={sup} R={K.ar[A]} sin={sinDin}/>})}</div>}
    {tab!=="hist"&&tab!=="per"&&tab!=="hrs"&&!car&&d&&K&&<div className="foot noimp"><div className="footin">
      <div className="mut">
        {miAr.map(function(A){return <span key={A} style={{marginRight:13}}>
          <Chip a={A} sm={true}/>&nbsp;<b style={{color:colAr(A)}}>{hdec(K.ar[A].min)} h</b></span>})}
        <span style={{opacity:.5}}>|</span>&nbsp;el dia: {K.tot.np} personas &middot;
        {" "}{hdec(K.tot.min-K.tot.minX)} h + {hdec(K.tot.minX)} h extra =
        {" "}{hdec(K.tot.min)} h
        {!K.tot.cuadra&&<span className="pill bad" style={{marginLeft:8}}>NO cuadra</span>}
        {sinCerrar(d,pl,"")>0&&<span className="pill rj" style={{marginLeft:8}}>
          {sinCerrar(d,pl,"")} sin cerrar</span>}</div>
      <div className="big" style={{color:"var(--ac2)"}}>{mny(tA.jor+tA.ext)}</div>
    </div></div>}
  </div>)}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
