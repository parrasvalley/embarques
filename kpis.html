<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPIs | Parras Valley</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
 :root{--bg:#070c10;--card:rgba(255,255,255,.04);--bd:rgba(255,255,255,.09);
       --tx:#e8efe4;--dim:#5d7488;--az:#38bdf8}
 *{box-sizing:border-box}
 body{background:var(--bg);color:var(--tx);margin:0;padding:0;
      font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
 .wrap{max-width:1100px;margin:0 auto;padding:14px}
 .barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
        background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px 14px}
 .et{font-size:10px;color:var(--dim);font-weight:900;letter-spacing:1}
 input,select{background:rgba(0,0,0,.45);border:2px solid rgba(56,189,248,.3);border-radius:8px;
   padding:9px 11px;color:var(--az);font-family:inherit;font-size:16px;font-weight:800;outline:none}
 button{font-family:inherit;cursor:pointer;border-radius:9px;font-weight:800;font-size:14px;
   padding:9px 15px;border:2px solid var(--bd);background:transparent;color:var(--dim)}
 button.p{border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.13);color:#4ade80}
 button.s{border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.12);color:var(--az)}
 .tabs{display:flex;gap:8px;margin:14px 0 10px}
 .card{background:var(--card);border:2px solid var(--bd);border-radius:14px;
       padding:14px 16px;margin-bottom:12px}
 .pill{display:inline-block;padding:5px 14px;border-radius:20px;font-weight:900;
       font-size:15px;letter-spacing:.5;color:#07110b}
 .big{font-size:30px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:12px}
 .b{background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
 .b .k{font-size:10px;color:var(--dim);font-weight:900;letter-spacing:.8}
 .b .v{font-size:19px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
 .cmp{font-size:11px;font-weight:800;margin-top:2px}
 .up{color:#4ade80}.dn{color:#f87171}.eq{color:var(--dim)}
 .avisoR{background:rgba(248,113,113,.1);border:2px solid rgba(248,113,113,.35);
         color:#fca5a5;border-radius:12px;padding:11px 14px;margin-bottom:12px;font-weight:700}
 .avisoV{background:rgba(74,222,128,.1);border:2px solid rgba(74,222,128,.35);
         color:#4ade80;border-radius:12px;padding:11px 14px;margin-bottom:12px;font-weight:800}
 .nota{font-size:14px;line-height:1.55;padding:5px 0;border-bottom:1px solid var(--bd)}
 table{width:100%;border-collapse:collapse}
 th{font-size:10px;color:var(--dim);font-weight:900;letter-spacing:.8;padding:7px 6px;
    text-align:right;border-bottom:2px solid var(--bd)}
 th:first-child,td:first-child{text-align:left}
 td{padding:9px 6px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;
    border-bottom:1px solid rgba(255,255,255,.05)}
 .vacio{text-align:center;color:#3b4a57;padding:40px 10px;font-size:16px;font-weight:800}
</style>
</head>
<body>
<div id="r"></div>
<script type="text/babel">
var BUILD="v2026-10-14-KPI3";
var FB="https://parrasvalley-default-rtdb.firebaseio.com";
var NODO="kpi-dias-v1";               /* el historial propio de KPIs, arranca vacio */
var LINEAS=["Persa","Slicer","Europeo","Morron","Minibel"];
var COLOR={Persa:"#4ade80",Slicer:"#38bdf8",Europeo:"#c084fc",Morron:"#f59e0b",Minibel:"#f43f5e"};
/* Persa, Morron y Minibel se miden en KILOS; Europeo y Slicer en PIEZAS.
   Control de empaque ya guarda lo llegado y lo empacado en la unidad del cultivo. */
var UNID={Persa:"kg",Slicer:"pz",Europeo:"pz",Morron:"kg",Minibel:"kg"};

var uS=React.useState,uE=React.useEffect,uM=React.useMemo;
function fget(k){return fetch(FB+"/"+k+".json?t="+Date.now())
  .then(function(r){return r.json()}).catch(function(){return null})}
function fput(k,v){return fetch(FB+"/"+k+".json",{method:"PUT",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(v)})
  .then(function(r){return !!(r&&r.ok)}).catch(function(){return false})}
function n0(v){var x=parseFloat(v);return isNaN(x)?0:x}
function r1(n){return Math.round(n*10)/10}
function r2(n){return Math.round(n*100)/100}
function miles(n){return n0(n).toLocaleString("es-MX",{maximumFractionDigits:0})}
function dec(n,d){return n0(n).toLocaleString("es-MX",{minimumFractionDigits:d,maximumFractionDigits:d})}
function pesos(n){return "$"+dec(n,2)}
function dk(f){return String(f||"").replace(/-/g,"")}
function hoy(){var d=new Date();return d.toISOString().slice(0,10)}
function mueveDia(f,n){var d=new Date(f+"T12:00:00");d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10)}
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fLargo(f){if(!f)return "";var p=f.split("-");
  return parseInt(p[2],10)+" "+MES[parseInt(p[1],10)-1]+" "+p[0]}


/* ---------- LAS HORAS DE TRABAJO DE LA LINEA, DEL HORARIO REAL ----------
   [stated] Miguel, 14/10/2026: "Lo que importa es cuanto trabajo la LINEA, no
   horas hombre. Si la linea trabajo cinco horas con diez hombres traes 50 horas
   hombre, pero realmente fueron cinco horas de trabajo."
   Dividir las horas hombre entre la gente da bien cuando una sola cuadrilla hizo
   ese cultivo, pero MIENTE cuando dos cuadrillas lo trabajan a la vez: el 12 de
   octubre el Slicer lo hicieron la plantilla de Persa/Slicer y la del Euro, y el
   promedio daba 5.1 h cuando de reloj fueron 8.
   Por eso se lee el horario de verdad, nomina-dias-v1/{fecha}.lin, y se juntan
   los intervalos de cada cultivo SIN contarlos dos veces cuando se encim an.
   Comida y Cena no son trabajo y no cuentan. Los paros SI cuentan como tiempo de
   la linea (la linea estaba ocupada en esa fruta) y ademas se reportan aparte,
   porque son justo lo que explica un costo alto. */
function aMin(t){var m=/^(\d{1,2}):(\d{2})$/.exec(String(t||""));
  return m?parseInt(m[1],10)*60+parseInt(m[2],10):null}
function esComida(a){var x=String(a||"").toLowerCase();
  return x.indexOf("comida")>=0||x.indexOf("cena")>=0}
function esParo(a){return String(a||"").toLowerCase().indexOf("paro")>=0}
function unir(iv){
  if(!iv.length)return 0;
  iv=iv.slice().sort(function(a,b){return a[0]-b[0]});
  var t=0,ini=iv[0][0],fin=iv[0][1];
  for(var i=1;i<iv.length;i++){
    if(iv[i][0]<=fin){ if(iv[i][1]>fin)fin=iv[i][1]; }
    else { t+=fin-ini; ini=iv[i][0]; fin=iv[i][1]; }
  }
  return t+fin-ini;
}
function horasDeLinea(dias){
  var out={};                       /* area -> {min, paro} */
  if(!dias||!dias.lin)return null;
  Object.keys(dias.lin).forEach(function(k){
    var rr=dias.lin[k]; if(!rr||!rr.length)return;
    /* la primera area real del dia, para los paros que caen antes de empezar */
    var prim="";
    for(var j=0;j<rr.length;j++){var a0=rr[j].ar;
      if(a0&&!esComida(a0)&&!esParo(a0)){prim=a0;break}}
    var ult="";
    for(var i=0;i<rr.length;i++){
      var r=rr[i]||{}, de=aMin(r.de), a=aMin(r.a), ar=r.ar;
      if(de===null||a===null)continue;
      if(a<=de)a+=1440;                     /* paso de la medianoche */
      if(esComida(ar))continue;             /* no es trabajo */
      var area=ar;
      if(esParo(ar))area=ult||prim;         /* el paro se carga donde venia */
      if(!area)continue;
      if(!out[area])out[area]={iv:[],ivP:[]};
      out[area].iv.push([de,a]);
      if(esParo(ar))out[area].ivP.push([de,a]);
      if(!esParo(ar))ult=ar;
    }
  });
  var res={};
  Object.keys(out).forEach(function(A){
    res[A]={min:unir(out[A].iv),paro:unir(out[A].ivP)};
  });
  return res;
}

function calVal(c,u){
  if(!c)return 0;
  if(u==="pz"){
    if(n0(c.pz)>0)return n0(c.pz);          /* Europeo: ya viene en piezas */
    if(n0(c.cj)>0)return n0(c.cj)*36;       /* Slicer: cajas de 36 CT -> piezas */
    return 0;
  }
  return n0(c.kg);
}

/* ---------- arma el dia con lo que ya guardaron las otras apps ---------- */
function armaDia(rend,gast,nom,hlin){
  var filas=[],T={rejas:0,bultos:0,gasto:0,min:0,mx:0,np:0};
  LINEAS.forEach(function(L){
    var R=rend[L]||null, G=(gast&&gast[L])||null, N=nom[L]||null;
    var rejas=0,rec=0,emp=0,ca=0,cb=0,cc=0;
    if(R){Object.keys(R).forEach(function(k){
      var r=R[k]||{};
      rejas+=n0(r.rejas); rec+=n0(r.kgRec); emp+=n0(r.kgEmp);
      var d=r.det||{};
      /* OJO CON LAS UNIDADES DEL DETALLE POR CALIDAD.
         Persa, Morron y Minibel: lo llegado y el detalle van los dos en KILOS.
         Europeo: los dos en PIEZAS (el detalle trae pz).
         Slicer: lo llegado va en PIEZAS pero el detalle trae los KILOS y las
         CAJAS de 36 CT. Sumar esos kilos contra piezas da porcentajes absurdos,
         asi que ahi se usan las cajas por 36, que es justo lo empacado. */
      ca+=calVal(d.a,UNID[L]); cb+=calVal(d.b,UNID[L]); cc+=calVal(d.c,UNID[L]);
    })}
    var min=N?n0(N.min):0, mx=N?n0(N.mx):0, np=N?n0(N.np):0;
    /* DOS HORAS DISTINTAS, Y NO SE CRUZAN (Miguel, 14/10/2026).
       HORAS HOMBRE = la suma de lo que trabajaron todas las personas en esa
       linea. Sirve para el COSTO, porque eso es lo que se paga.
       HORAS DE LINEA = las horas de RELOJ que la linea estuvo en ese cultivo,
       o sea horas hombre entre la gente. Si 24 personas metieron 132 horas
       hombre, la linea corrio 5.5 horas. ESA es con la que se mide el ritmo:
       los bultos y las rejas por hora van sobre las horas de linea, no sobre
       las horas hombre. Con horas hombre salian 26 bultos/hora y no cuadraba
       con lo que el ve en el empaque. */
    var hh=min/60, hx=mx/60;
    var HL=hlin&&hlin[L]?hlin[L]:null;
    var h=HL?HL.min/60:(np>0?(min/np)/60:0);   /* del horario real; si no hay, promedio */
    var hpar=HL?HL.paro/60:0;
    var exacta=!!HL;
    var bultos=G?n0(G.bultos):0, gasto=G?n0(G.totalCosto):0;
    var merma=rec-emp;
    if(!R&&!G&&!N)return;                      /* esa linea no corrio ese dia */
    filas.push({L:L,u:UNID[L],rejas:rejas,rec:rec,emp:emp,
      pa:rec>0?100*ca/rec:0, pb:rec>0?100*cb/rec:0, pc:rec>0?100*cc/rec:0,
      pm:rec>0?100*merma/rec:0, merma:merma,
      h:h,hh:hh,hx:hx,hpar:hpar,exacta:exacta,np:np,bultos:bultos,gasto:gasto,
      rejasH:h>0?rejas/h:0, bultosH:h>0?bultos/h:0, cpb:bultos>0?gasto/bultos:0,
      falta:{rend:!R,gast:!G,nom:!N}});
    T.rejas+=rejas; T.bultos+=bultos; T.gasto+=gasto; T.min+=min; T.mx+=mx; T.np+=np;
  });
  /* En el TOTAL del dia no se suman las horas de linea: las lineas corren al
     mismo tiempo y sumarlas no significa nada. El total va en horas hombre. */
  T.hh=T.min/60; T.hx=T.mx/60;
  T.cpb=T.bultos>0?T.gasto/T.bultos:0;
  return {filas:filas,tot:T};
}

/* ---------- comparacion contra el dia guardado anterior ---------- */
function cmp(hoyV,antV,menosEsMejor){
  if(ant0(antV)===0||hoyV===undefined||hoyV===null)return null;
  var d=hoyV-antV, p=100*d/Math.abs(antV);
  if(Math.abs(p)<0.5)return null;     /* si no se movio, no se escribe nada */
  var bueno=menosEsMejor?(d<0):(d>0);
  return {t:(d>0?"▲ ":"▼ ")+dec(Math.abs(p),1)+"%", c:bueno?"up":"dn", p:p};
}
function ant0(v){return (v===undefined||v===null||isNaN(v))?0:v}

function Cmp(props){
  var c=props.c;
  if(!c)return null;
  return <div className={"cmp "+c.c}>{c.t}</div>;
}
function B(props){
  return (<div className="b">
    <div className="k">{props.k}</div>
    <div className="v" style={props.col?{color:props.col}:null}>{props.v}</div>
    <Cmp c={props.c}/>
  </div>);
}

function App(){
  var s1=uS(hoy()),f=s1[0],setF=s1[1];
  var s2=uS("dia"),tab=s2[0],setTab=s2[1];
  var s3=uS(null),rend=s3[0],setRend=s3[1];
  var s4=uS(null),gast=s4[0],setGast=s4[1];
  var s5=uS(null),nom=s5[0],setNom=s5[1];
  var sH=uS(null),hlin=sH[0],setHlin=sH[1];
  var s6=uS({}),hist=s6[0],setHist=s6[1];
  var s7=uS(false),cargando=s7[0],setCargando=s7[1];
  var s8=uS(""),msg=s8[0],setMsg=s8[1];
  var s9=uS(""),busca=s9[0],setBusca=s9[1];
  var sB=uS(""),avBul=sB[0],setAvBul=sB[1];   /* el aviso del boton de bultos, aparte */

  uE(function(){ fget(NODO).then(function(d){ setHist((d&&typeof d==="object")?d:{}) }); },[]);

  /* EL BOTON VERDE DEL ARCHIVO DE BULTOS SIGUE ENTRANDO POR AQUI.
     El link del archivo de trazabilidad apunta a kpis.html?x=<epoch>#bultos=<b64>
     y escribe kpi-bultos-v1/{fecha}, que es de donde GASTOS saca las cajas.
     Esta pagina ya no usa ese nodo para calcular (los bultos los lee de gastos,
     ya convertidos), pero el lector NO se puede quitar: si se va, se rompe la
     cadena y gastos se queda sin bultos. */
  uE(function(){
    var h=String(location.hash||"")+"&"+String(location.search||"");
    var m=h.match(/bultos=([A-Za-z0-9_\-+\/=]+)/);
    if(!m)return;
    try{
      var s=m[1].split("-").join("+").split("_").join("/");
      while(s.length%4)s+="=";
      var pl=JSON.parse(decodeURIComponent(escape(atob(s))));
      if(!pl||!pl.f||!pl.b)throw new Error("payload incompleto");
      setAvBul("Cargando los bultos del "+fLargo(pl.f)+"...");
      fput("kpi-bultos-v1/"+pl.f,pl.b).then(function(ok){
        if(!ok){setAvBul("✗ NO se pudieron cargar los bultos. Vuelve a picarle al botón.");return}
        var n=0;Object.keys(pl.b).forEach(function(k){
          var o=pl.b[k]||{};Object.keys(o).forEach(function(p){n+=n0(o[p])})});
        setAvBul("✓ Bultos cargados del "+fLargo(pl.f)+": "+miles(n)+" cajas");
        setF(pl.f);
        try{history.replaceState(null,"",location.pathname)}catch(e){}
      });
    }catch(err){ setAvBul("✗ El link de bultos vino incompleto."); }
  },[]);

  uE(function(){
    if(!f)return;
    setCargando(true);setMsg("");
    var pr=LINEAS.map(function(L){
      return fget("rendimientos-hist-v1/"+dk(f)+"/"+L+"/ranchos")
        .then(function(v){return {L:L,v:v}})});
    var pn=LINEAS.map(function(L){
      return fget("nomina-hist-v1/"+L+"/"+f).then(function(v){return {L:L,v:v}})});
    Promise.all([Promise.all(pr),fget("gastos-dias-v1/"+f),Promise.all(pn),
                 fget("nomina-dias-v1/"+f)])
      .then(function(res){
        var R={},N={};
        res[0].forEach(function(x){if(x.v&&typeof x.v==="object")R[x.L]=x.v});
        res[2].forEach(function(x){if(x.v&&typeof x.v==="object")N[x.L]=x.v});
        setRend(R);setGast(res[1]||null);setNom(N);
        setHlin(horasDeLinea(res[3]));setCargando(false);
      }).catch(function(){setCargando(false);setMsg("No se pudo leer.")});
  },[f]);

  var dia=uM(function(){
    if(!rend&&!gast&&!nom)return null;
    return armaDia(rend||{},gast,nom||{},hlin);
  },[rend,gast,nom,hlin]);

  /* el dia guardado inmediatamente anterior, para comparar */
  var ant=uM(function(){
    var ks=Object.keys(hist).filter(function(k){return k<f}).sort();
    return ks.length?hist[ks[ks.length-1]]:null;
  },[hist,f]);
  function antL(L){
    if(!ant||!ant.filas)return null;
    for(var i=0;i<ant.filas.length;i++)if(ant.filas[i].L===L)return ant.filas[i];
    return null;
  }

  function guarda(){
    if(!dia||!dia.filas.length){setMsg("Ese día no trae nada que guardar.");return}
    var e={f:f,ts:Date.now(),filas:dia.filas,tot:dia.tot};
    setMsg("Guardando...");
    fput(NODO+"/"+f,e).then(function(ok){
      if(!ok){setMsg("✗ NO se guardó. Vuelve a intentar.");return}
      setHist(function(p){var n=Object.assign({},p);n[f]=e;return n});
      setMsg("✓ Guardado el "+fLargo(f));
    });
  }

  var notas=uM(function(){
    if(!dia||!ant)return [];
    var out=[];
    dia.filas.forEach(function(x){
      var a=antL(x.L);if(!a)return;
      function di(nom,hoyV,antV,menos,fmt){
        if(!antV)return;
        var p=100*(hoyV-antV)/Math.abs(antV);
        if(Math.abs(p)<3)return;
        var sube=p>0, bueno=menos?!sube:sube;
        out.push({L:x.L,bueno:bueno,
          t:nom+" "+(sube?"subió":"bajó")+" "+dec(Math.abs(p),0)+"%, de "+fmt(antV)+" a "+fmt(hoyV)});
      }
      di("el costo por bulto",x.cpb,a.cpb,true,function(v){return pesos(v)});
      di("la merma",x.pm,a.pm,true,function(v){return dec(v,1)+"%"});
      di("el ritmo de bultos por hora",x.bultosH,a.bultosH,false,function(v){return dec(v,1)});
      di("la primera",x.pa,a.pa,false,function(v){return dec(v,1)+"%"});
    });
    return out;
  },[dia,ant]);

  var faltan=uM(function(){
    if(!dia)return [];
    var out=[];
    if(!dia.filas.length)return ["No hay nada de este día en ninguna de las apps."];
    var sr=dia.filas.filter(function(x){return x.falta.rend}).map(function(x){return x.L});
    var sg=dia.filas.filter(function(x){return x.falta.gast}).map(function(x){return x.L});
    var sn=dia.filas.filter(function(x){return x.falta.nom}).map(function(x){return x.L});
    if(sr.length)out.push("Falta guardar el día en CONTROL DE EMPAQUE: "+sr.join(", ")+". Sin eso no hay calidades ni merma.");
    if(sg.length)out.push("Falta guardar el día en GASTOS: "+sg.join(", ")+". Sin eso no hay bultos ni costo.");
    if(sn.length)out.push("Falta guardar el día en NÓMINA: "+sn.join(", ")+". Sin eso no hay horas.");
    return out;
  },[dia]);

  var diasHist=uM(function(){
    var ks=Object.keys(hist).sort(function(a,b){return a<b?1:-1});
    if(busca)ks=ks.filter(function(k){return k.indexOf(busca)>=0});
    return ks;
  },[hist,busca]);

  return (
  <div className="wrap">
    <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:12}}>
      <div style={{fontSize:22,fontWeight:900,letterSpacing:3,color:"var(--az)"}}>KPIs</div>
      <div style={{fontSize:11,color:"var(--dim)",fontWeight:800}}>PARRAS VALLEY · {BUILD}</div>
    </div>

    <div className="barra">
      <div>
        <div className="et">DÍA</div>
        <input type="date" value={f} onChange={function(e){setF(e.target.value);setMsg("")}}/>
      </div>
      <button onClick={function(){setF(mueveDia(f,-1));setMsg("")}}>«</button>
      <button onClick={function(){setF(mueveDia(f,1));setMsg("")}}>»</button>
      {f!==hoy()&&<button onClick={function(){setF(hoy());setMsg("")}}>hoy</button>}
      <div style={{flex:1}}/>
      <button className="p" onClick={guarda}>Guardar el día</button>
      {msg&&<div style={{fontSize:13,fontWeight:800,
        color:msg.indexOf("✗")>=0?"#f87171":msg.indexOf("✓")>=0?"#4ade80":"var(--dim)"}}>{msg}</div>}
    </div>

    {avBul&&<div className={avBul.indexOf("\u2717")>=0?"avisoR":"avisoV"} style={{marginTop:12}}>{avBul}</div>}
    <div className="tabs">
      <button className={tab==="dia"?"s":""} onClick={function(){setTab("dia")}}>EL DÍA</button>
      <button className={tab==="hist"?"s":""} onClick={function(){setTab("hist")}}>HISTORIAL</button>
    </div>

    {tab==="dia"&&(
    <div>
      {cargando&&<div className="vacio">Leyendo las apps...</div>}
      {!cargando&&faltan.map(function(t,i){return <div className="avisoR" key={i}>{t}</div>})}

      {!cargando&&dia&&dia.filas.length>0&&(
      <div>
        <div className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",flexWrap:"wrap",gap:8}}>
            <div style={{fontSize:16,fontWeight:900}}>{fLargo(f)}</div>
            <div style={{fontSize:12,color:"var(--dim)",fontWeight:800}}>
              {ant?("comparado contra el "+fLargo(ant.f)):"sin día anterior guardado con qué comparar"}</div>
          </div>
          <div className="grid">
            <B k="REJAS" v={miles(dia.tot.rejas)} c={cmp(dia.tot.rejas,ant&&ant.tot.rejas,false)}/>
            <B k="BULTOS" v={miles(dia.tot.bultos)} c={cmp(dia.tot.bultos,ant&&ant.tot.bultos,false)}/>
            <B k="HORAS HOMBRE" v={dec(dia.tot.hh,1)} c={cmp(dia.tot.hh,ant&&ant.tot.hh,true)}/>
            <B k="GASTO" v={pesos(dia.tot.gasto)} c={cmp(dia.tot.gasto,ant&&ant.tot.gasto,true)}/>
            <B k="$/BULTO" v={pesos(dia.tot.cpb)} col="var(--az)" c={cmp(dia.tot.cpb,ant&&ant.tot.cpb,true)}/>
            <B k="GENTE" v={miles(dia.tot.np)} c={null}/>
          </div>
        </div>

        {dia.filas.map(function(x){
          var a=antL(x.L);
          return (
          <div className="card" key={x.L}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
              <span className="pill" style={{background:COLOR[x.L]}}>{x.L.toUpperCase()}</span>
              <div style={{textAlign:"right"}}>
                <div className="et">COSTO POR BULTO</div>
                <div className="big" style={{color:COLOR[x.L]}}>{pesos(x.cpb)}</div>
                <Cmp c={cmp(x.cpb,a&&a.cpb,true)}/>
              </div>
            </div>
            <div className="grid">
              <B k="REJAS QUE LLEGARON" v={miles(x.rejas)} c={cmp(x.rejas,a&&a.rejas,false)}/>
              <B k="BULTOS EMPACADOS" v={miles(x.bultos)} c={cmp(x.bultos,a&&a.bultos,false)}/>
              <B k={"HORAS DE LÍNEA"+(x.exacta?"":" (aprox)")} v={dec(x.h,1)} c={cmp(x.h,a&&a.h,true)}/>
              <B k="REJAS POR HORA" v={dec(x.rejasH,0)} c={cmp(x.rejasH,a&&a.rejasH,false)}/>
              <B k="BULTOS POR HORA" v={dec(x.bultosH,0)} c={cmp(x.bultosH,a&&a.bultosH,false)}/>
              <B k="GASTO" v={pesos(x.gasto)} c={cmp(x.gasto,a&&a.gasto,true)}/>
              <B k="PRIMERA" v={dec(x.pa,1)+"%"} c={cmp(x.pa,a&&a.pa,false)}/>
              <B k="SEGUNDA" v={dec(x.pb,1)+"%"} c={cmp(x.pb,a&&a.pb,true)}/>
              <B k="TERCERA" v={dec(x.pc,1)+"%"} c={cmp(x.pc,a&&a.pc,true)}/>
              <B k="MERMA" v={dec(x.pm,1)+"%"} col="#f59e0b" c={cmp(x.pm,a&&a.pm,true)}/>
            </div>
            <div style={{fontSize:11,color:"var(--dim)",marginTop:9,fontWeight:700}}>
              {miles(x.np)} personas · {dec(x.hh,1)} horas hombre · {dec(x.hx,1)} h extra
              {x.hpar>0&&<b style={{color:"#f59e0b"}}> &middot; {dec(x.hpar,1)} h parada </b>}
              <span style={{marginLeft:6}}>&middot; los % van sobre lo que llegó</span>
            </div>
          </div>);
        })}

        {notas.length>0&&(
        <div className="card">
          <div className="et" style={{marginBottom:8}}>QUÉ CAMBIÓ CONTRA EL DÍA ANTERIOR</div>
          {notas.map(function(n,i){return (
            <div className="nota" key={i}>
              <span className="pill" style={{background:COLOR[n.L],fontSize:11,padding:"2px 9px"}}>{n.L}</span>
              <span style={{marginLeft:8,color:n.bueno?"#4ade80":"#f87171",fontWeight:800}}>{n.t}</span>
            </div>)})}
        </div>)}
      </div>)}

      {!cargando&&dia&&dia.filas.length===0&&
        <div className="vacio">No hay nada de este día todavía.</div>}
    </div>)}

    {tab==="hist"&&(
    <div>
      <div className="card">
        <div className="et" style={{marginBottom:6}}>BUSCAR</div>
        <input type="date" value={busca} onChange={function(e){setBusca(e.target.value)}}/>
        {busca&&<button style={{marginLeft:8}} onClick={function(){setBusca("")}}>todo</button>}
      </div>
      {diasHist.length===0
        ? <div className="vacio">Todavía no has guardado ningún día.</div>
        : (<div className="card">
            <table>
              <thead><tr>
                <th>DÍA</th><th>REJAS</th><th>BULTOS</th><th>H HOMBRE</th>
                <th>GASTO</th><th>$/BULTO</th><th>GENTE</th><th></th>
              </tr></thead>
              <tbody>
                {diasHist.map(function(k){var d=hist[k];var t=(d&&d.tot)||{};
                  return (<tr key={k}>
                    <td style={{fontWeight:900}}>{fLargo(k)}</td>
                    <td>{miles(t.rejas)}</td>
                    <td>{miles(t.bultos)}</td>
                    <td>{dec(t.hh,1)}</td>
                    <td>{pesos(t.gasto)}</td>
                    <td style={{color:"var(--az)",fontWeight:900}}>{pesos(t.cpb)}</td>
                    <td>{miles(t.np)}</td>
                    <td><button onClick={function(){setF(k);setTab("dia")}}>abrir</button></td>
                  </tr>)})}
              </tbody>
            </table>
          </div>)}
    </div>)}
  </div>);
}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);
</script>
</body>
</html>
