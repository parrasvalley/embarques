<style>

<script>
var BUILD="v2026-09-23-CORTE21";
(function(){try{
  var n=parseInt(sessionStorage.getItem("corte-rec")||"0");
  if(n>3)return;
  fetch(location.href.split("#")[0]+"?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()})
  .then(function(t){var m=t.match(/var BUILD="([^"]+)"/);
    if(m&&m[1]!==BUILD){sessionStorage.setItem("corte-rec",String(n+1));location.reload(true);}});
}catch(e){}})();

<script type="text/babel">
var uS=React.useState,uE=React.useEffect,uM=React.useMemo;
var FB="https://parrasvalley-default-rtdb.firebaseio.com";
// Abierto como archivo local, el navegador manda Origin null y el fetch se
// puede caer por CORS. Si pasa, se vuelve a pedir con una etiqueta <script>
// (callback), que no pide permiso de CORS. Asi el archivo jala igual desde
// el escritorio que desde la pagina.
var _jsonpN=0;
function jsonp(k){
  return new Promise(function(ok){
    var fn="_cb"+(++_jsonpN)+"_"+Date.now();
    var sc=document.createElement("script");
    var t=setTimeout(function(){fin(null)},20000);
    function fin(v){try{clearTimeout(t)}catch(e){}
      try{delete window[fn]}catch(e){window[fn]=undefined}
      try{sc.parentNode.removeChild(sc)}catch(e){}
      ok(v);}
    window[fn]=function(d){fin(d)};
    sc.onerror=function(){fin(null)};
    sc.src=FB+"/"+k+".json?callback="+fn+"&t="+Date.now();
    document.head.appendChild(sc);
  });
}
function fget(k){
  return fetch(FB+"/"+k+".json?t="+Date.now())
    .then(function(r){return r.json()})
    .catch(function(){return jsonp(k)});
}
function fput(k,v){return fetch(FB+"/"+k+".json",{method:"PUT",body:JSON.stringify(v)})
  .then(function(r){return r.ok})
  .catch(function(){return false})}
function lsR(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ni(v){var x=parseInt(v);return isNaN(x)?0:x}
function mil(x){return Number(x||0).toLocaleString("en-US")}
function dosD(n){n=parseInt(n,10);return (n<10?"0":"")+n}
function aArr(x){if(!x)return [];return Array.isArray(x)?x.filter(Boolean):Object.values(x).filter(Boolean)}
function iso(d){return d.getFullYear()+"-"+dosD(d.getMonth()+1)+"-"+dosD(d.getDate())}
function masDias(f,n){var d=new Date(f+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function tsISO(ts){if(!ts)return "";var d=new Date(ts);if(d.getHours()<6)d=new Date(d.getTime()-6*3600000);return iso(d)}
var MES3={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12};
// Misma lectura de fechas que control de empaque y KPIs: recibo las escribe
// de varias formas y todas tienen que caer en el dia correcto.
function leeFechaTexto(f){
  var s=String(f||"").toLowerCase().replace(/[.,]/g," ");
  var m=s.match(/(\d{4})\s*[-\/]\s*(\d{1,2})\s*[-\/]\s*(\d{1,2})/);
  if(m)return m[1]+"-"+dosD(m[2])+"-"+dosD(m[3]);
  m=s.match(/(\d{1,2})\s*[-\/]\s*(\d{1,2})\s*[-\/]\s*(\d{4})/);
  if(m)return m[3]+"-"+dosD(m[2])+"-"+dosD(m[1]);
  s=s.replace(/\bde\b/g," ").replace(/\bdel\b/g," ");
  m=s.match(/(\d{1,2})\s+([a-zñáéíóú]+)\s+(\d{4})/);
  if(m&&MES3[m[2].slice(0,3)])return m[3]+"-"+dosD(MES3[m[2].slice(0,3)])+"-"+dosD(m[1]);
  m=s.match(/([a-zñáéíóú]+)\s+(\d{1,2})\s+(\d{4})/);
  if(m&&MES3[m[1].slice(0,3)])return m[3]+"-"+dosD(MES3[m[1].slice(0,3)])+"-"+dosD(m[2]);
  return "";
}
function recISO(h){
  var f=leeFechaTexto((h&&h.fecha)||"");
  if(f)return f;
  if(h&&h.id){var d=new Date(h.id);if(d.getHours()<6)d=new Date(d.getTime()-6*3600000);return iso(d);}
  return "";
}

/* ---------- organico o convencional ----------
   En la proyeccion de campo el tipo viene como llave dentro de cada cultivo
   (org / cv / organico / convencional). En recibo viene en el lote, y si no
   lo trae, manda la regla de la casa: en PERSA el rancho decide (PVT es
   convencional, Cordillera y Forrajera organicos) y en EUROPEO la malla
   (6A organico, 6 y 6B convencional). */
function esOrgTxt(x){
  var t=String(x||"").toLowerCase();
  if(!t)return null;
  if(t.indexOf("org")>=0)return true;
  if(t.indexOf("conv")>=0||t==="cv"||t==="cnv")return false;
  return null;
}
function tipoLote(l,cu,rid){
  var m=String((l&&(l.malla||l.lote))||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  return tipoDe(cu,rid,m,l);
}
// REGLAS DE LA CASA (dadas por Miguel el 23 sep 2026):
//   PVT / PBT / Parras Valley Tomatoes: TODO convencional (hoy solo trae persa)
//   Forrajera: persa ORGANICO (mallas 1 y 3); morron y minibel CONVENCIONALES
//   Cordillera: TODO organico, menos el europeo malla 6B y el slicer malla 2A,
//               que son convencionales
//   Otros ranchos (FEPO): manda lo que venga marcado en el lote
function tipoDe(cu,rid,malla,l){
  var m=String(malla||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(rid==="pvt")return "cv";
  if(rid==="crp"){
    if(cu==="Europeo"&&m==="6b")return "cv";
    if(cu==="Slicer"&&m==="2a")return "cv";
    return "org";
  }
  if(rid==="f4h"){
    if(cu==="Morron"||cu==="Minibel")return "cv";
    return "org";
  }
  // lo que traiga el lote
  if(l&&(l.organico===true||l.organico==="si"||l.organico==="Si"))return "org";
  if(l&&l.organico===false)return "cv";
  var t=esOrgTxt(l&&(l.tipoProd||l.tipo||l.tipoFruta));
  if(t!==null)return t?"org":"cv";
  if(m==="6a")return "org";
  if(m==="6"||m==="6b")return "cv";
  return "cv";
}

/* ---------- nombres ---------- */
var DIAS=["Vie","Sab","Dom","Lun","Mar","Mie","Jue"];
var RL={pvt:"PVT",crp:"Cordillera",f4h:"Forrajera",fepo:"FEPO"};
function ranNorm(r){
  var s=String(r||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(!s)return "";
  if(s.indexOf("cord")>=0||s==="crp"||s==="cpr")return "crp";
  if(s.indexOf("pvt")>=0||s.indexOf("pbt")>=0)return "pvt";
  if(s.indexOf("forr")>=0||s==="f4h")return "f4h";
  if(s.indexOf("fepo")>=0)return "fepo";
  return s;
}
function ranLbl(r){return RL[r]||String(r||"").toUpperCase()}
var CULTIVOS=["Persa","Slicer","Europeo","Morron","Minibel"];
function cultNorm(c){
  var s=String(c||"").toLowerCase().replace(/[^a-z]/g,"");
  if(s.indexOf("persa")>=0)return "Persa";
  if(s.indexOf("slicer")>=0||s.indexOf("bola")>=0)return "Slicer";
  if(s.indexOf("europ")>=0||s.indexOf("euro")>=0)return "Europeo";
  if(s.indexOf("morron")>=0||s.indexOf("bell")>=0||s.indexOf("pimiento")>=0)return "Morron";
  if(s.indexOf("minibel")>=0||s.indexOf("cherry")>=0||s.indexOf("uva")>=0)return "Minibel";
  return "";
}
function normSemFecha(s){
  if(!s)return "";s=String(s).trim();
  if(s.length===10&&s[4]==="-")return s;
  if(s.length===10&&s[2]==="/")return s.slice(6)+"-"+s.slice(3,5)+"-"+s.slice(0,2);
  if(s.length===8)return s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8);
  return s;
}
// Viernes de la semana EN CURSO. La semana corre de viernes a jueves y se va
// llenando dia con dia conforme recibo va cerrando; no hay que esperar a que
// termine. Con el boton de atras se ven las semanas anteriores.
function viernesDeLaSemana(){
  var d=new Date(),off={5:0,6:1,0:2,1:3,2:4,3:5,4:6}[d.getDay()]||0;
  var f=new Date(d);f.setDate(d.getDate()-off);return iso(f);
}

/* ============ CORTES CAPTURADOS A MANO ============
   Cuando recibo no alcanza a capturar (sin internet, domingo, etc.), Miguel
   manda la hoja y el dato se escribe AQUI. Dias: 0=Vie 1=Sab 2=Dom 3=Lun
   4=Mar 5=Mie 6=Jue. La llave es "rancho|cultivo" y el valor son rejas.
   Esto MANDA sobre lo que traiga recibo de ese rancho, cultivo y dia. */
var MANUAL={
  "2026-09-11":{
    "0":{ "f4h|Persa":1922, "crp|Persa":240, "crp|Slicer":1341 },
    "2":{ "f4h|Persa":1692, "f4h|Slicer":34, "crp|Persa":452, "crp|Europeo":1520 }
  }
};

function App(){
  var [sem,setSem]=uS(viernesDeLaSemana());
  var [D,setD]=uS(null);
  var [est,setEst]=uS("cargando");
  var [vista,setVista]=uS("dif");     // proy | real | dif
  var [modoDom,setModoDom]=uS(false);
  var [dom,setDom]=uS({});            // domingo capturado a mano
  var [guard,setGuard]=uS("");
  var [diag,setDiag]=uS(false);
  var [ult,setUlt]=uS(null);
  var [diaCap,setDiaCap]=uS("2");
  var [ver,setVer]=uS("");            // rancho|cultivo|dia de la celda abierta
  var [verRes,setVerRes]=uS(false);   // resumen corto del dia en curso
  var [tipo,setTipo]=uS("todos");     // todos | org | cv

  function cargar(){
    setEst("cargando");
    var dg=[];
    // La proyeccion de campo ha vivido en varios nombres. Se prueban todos,
    // igual que lo hace proyeccion-empaque, y se queda con el que traiga datos.
    var PATHS=["proyeccion-campo-v1","campo-proyeccion-v1","proyeccion-campo","campo-proyeccion"];
    function buscaProy(i){
      if(i>=PATHS.length)return Promise.resolve({d:null,de:""});
      return fget(PATHS[i]).then(function(d){
        var n=d?Object.keys(d).length:0;
        dg.push({k:PATHS[i],n:n,m:d?Object.keys(d).slice(0,3).join("  |  "):"vacio"});
        if(n)return {d:d,de:PATHS[i]};
        return buscaProy(i+1);
      });
    }
    Promise.all([buscaProy(0),fget("recibo-hist-v1"),fget("recibo-inv-v1"),fget("corte-dom-v1")])
      .then(function(v){
        var dd=v[3]||{};
        var loc=lsR("corte-dom")||{};
        Object.keys(loc).forEach(function(sk){dd[sk]=Object.assign({},dd[sk]||{},loc[sk])});
        // Lo guardado antes era solo del domingo y no traia el dia; se acomoda
        // bajo el dia 2 para no perderlo.
        Object.keys(dd).forEach(function(sk){
          var bl=dd[sk]||{},viejo={},hayViejo=false;
          Object.keys(bl).forEach(function(k){
            if(/^[0-6]$/.test(k))return;
            viejo[k]=bl[k];hayViejo=true;delete bl[k];
          });
          if(hayViejo)bl["2"]=Object.assign({},viejo,bl["2"]||{});
        });
        // Lo que viene escrito en MANUAL se mete encima: es lo que Miguel mando
        // en la hoja y no esta en ninguna aplicacion.
        Object.keys(MANUAL).forEach(function(sk){
          if(!dd[sk])dd[sk]={};
          Object.keys(MANUAL[sk]).forEach(function(di){
            dd[sk][di]=Object.assign({},dd[sk][di]||{},MANUAL[sk][di]);
          });
        });
        var h=aArr(v[1]);
        dg.push({k:"recibo-hist-v1",n:h.length,
          m:h.slice(-4).map(function(x){return (x.lineaNombre||x.linea||"?")+" "+(x.fecha||x.id||"?")+" -> "+recISO(x)}).join("   ")||"vacio"});
        var la=Object.keys(v[2]||{});
        dg.push({k:"recibo-inv-v1",n:la.length,m:la.join(", ")||"vacio"});
        setD({proy:v[0].d,proyDe:v[0].de,hist:v[1],abierto:v[2],dom:dd,diag:dg});
        setDom(dd[sem]||{});
        setUlt(new Date());
        setEst("listo");
      }).catch(function(e){setD({diag:dg,err:String(e&&e.message||e)});setEst("error")});
  }
  uE(cargar,[sem]);
  // Se queda al pendiente sola: relee cada 2 minutos y tambien cuando uno
  // regresa a la pestana. Asi, en cuanto campo proyecta o recibo cierra un
  // dia, el reporte ya lo trae sin que nadie le pique nada.
  uE(function(){
    var t=setInterval(function(){if(!document.hidden)cargar()},120000);
    function alVolver(){if(!document.hidden)cargar()}
    document.addEventListener("visibilitychange",alVolver);
    window.addEventListener("focus",alVolver);
    return function(){clearInterval(t);
      document.removeEventListener("visibilitychange",alVolver);
      window.removeEventListener("focus",alVolver);};
  },[sem]);

  /* ---- PROYECTADO: proyeccion-campo-v1, claves "semana|rancho|dia" ---- */
  var proy=uM(function(){
    var out={},ran={},oOrg={},oCv={};
    if(!D||!D.proy)return {d:out,ranchos:[],org:oOrg,cv:oCv};
    var sN=normSemFecha(sem);
    var DIA2I={Vie:0,Sab:1,Dom:2,Lun:3,Mar:4,Mie:5,Jue:6};
    Object.keys(D.proy).forEach(function(k){
      var p=k.split("|");
      if(normSemFecha((p[0]||"").trim())!==sN)return;
      var rid=ranNorm(p[1]);if(!rid)return;
      var di=parseInt(p[2]);if(isNaN(di))di=DIA2I[(p[2]||"").trim()];
      if(di===undefined||isNaN(di))return;
      var blo=D.proy[k]||{};
      Object.keys(blo).forEach(function(nom){
        var _u=String(nom).toUpperCase().replace(/[^A-Z0-9]/g,"");
        if(_u.indexOf("EUROPEOM")>=0)return;   // mallas de prueba
        var cu=cultNorm(nom);if(!cu)return;
        var tt=0,to=0,tc=0,ob=blo[nom]||{};
        Object.keys(ob).forEach(function(tipo){
          var v=ob[tipo],n=ni(v&&typeof v==="object"?v.rejas:v);
          if(!n)return;
          tt+=n;
          var eo=esOrgTxt(tipo);
          if(eo===null)eo=(tipoDe(cu,rid,tipo,null)==="org");   // sin nombre de tipo
          if(eo)to+=n;else tc+=n;
        });
        if(!tt)return;
        ran[rid]=1;
        var kk=rid+"|"+cu+"|"+di;
        out[kk]=(out[kk]||0)+tt;
        oOrg[kk]=(oOrg[kk]||0)+to;
        oCv[kk]=(oCv[kk]||0)+tc;
      });
    });
    return {d:out,ranchos:Object.keys(ran),org:oOrg,cv:oCv};
  },[D,sem]);

  /* ---- REAL: recibo. Cierre manda sobre el dia abierto ----
     El dia de cada lote sale de la HORA EN QUE SE CAPTURO (l.ts), no de la
     fecha escrita en el cierre. Si en recibo cierran tarde (el corte del
     domingo lo cierran el lunes), el cierre trae fecha del lunes pero los
     lotes se capturaron el domingo: van al domingo. Solo si el lote no trae
     hora se usa la fecha del cierre. */
  var real=uM(function(){
    var out={},ran={},dias={},org={},rOrg={},rCv={};
    if(!D)return {d:out,ranchos:[],dias:dias,dcap:{},org:org,tOrg:rOrg,tCv:rCv};
    var fechas={};for(var i=0;i<7;i++)fechas[masDias(sem,i)]=i;
    function apunta(kk,x){(org[kk]=org[kk]||[]).push(x)}
    // 1) cierres
    var cerrado={};
    aArr(D.hist).forEach(function(h){
      var fc=recISO(h);
      var cu=cultNorm(h.lineaNombre||h.linea||"");if(!cu)return;
      aArr(h.lotes).forEach(function(l){
        if(!l||!l.rancho)return;
        var fl=l.ts?tsISO(l.ts):"";
        var f=fl||fc;var di=fechas[f];if(di===undefined)return;
        var rid=ranNorm(l.rancho);if(!rid)return;
        cerrado[cu+"|"+di]=1;dias[cu+"|"+di]="cerrado";dias["dia|"+di]="cerrado";
        ran[rid]=1;
        var kk=rid+"|"+cu+"|"+di;
        out[kk]=(out[kk]||0)+ni(l.cajas);
        if(tipoLote(l,cu,rid)==="org")rOrg[kk]=(rOrg[kk]||0)+ni(l.cajas);
        else rCv[kk]=(rCv[kk]||0)+ni(l.cajas);
        apunta(kk,{rej:ni(l.cajas),de:"cierre",fc:fc,esc:h.fecha||"",ts:l.ts||0,
          movido:!!(fl&&fc&&fl!==fc),malla:l.malla||l.lote||""});
      });
    });
    // 2) dia abierto, solo donde no hubo cierre
    Object.keys(D.abierto||{}).forEach(function(ln){
      var cu=cultNorm(ln);if(!cu)return;
      aArr((D.abierto[ln]||{}).lotes).forEach(function(l){
        if(!l||!l.rancho)return;
        var f=tsISO(l.ts);var di=fechas[f];if(di===undefined)return;
        if(cerrado[cu+"|"+di])return;
        var rid=ranNorm(l.rancho);if(!rid)return;
        ran[rid]=1;dias[cu+"|"+di]="abierto";dias["dia|"+di]=dias["dia|"+di]||"abierto";
        var kk=rid+"|"+cu+"|"+di;
        out[kk]=(out[kk]||0)+ni(l.cajas);
        if(tipoLote(l,cu,rid)==="org")rOrg[kk]=(rOrg[kk]||0)+ni(l.cajas);
        else rCv[kk]=(rCv[kk]||0)+ni(l.cajas);
        apunta(kk,{rej:ni(l.cajas),de:"abierto",ts:l.ts||0,malla:l.malla||l.lote||""});
      });
    });
    // 3) lo capturado a mano, para cualquier dia.
    // Lo tecleado MANDA sobre lo que trajo recibo de ese rancho, cultivo y dia.
    var dcap={};
    Object.keys(dom||{}).forEach(function(di){
      var blo=dom[di]||{};
      Object.keys(blo).forEach(function(kk){
        var v=ni(blo[kk]);if(!v)return;
        var p=kk.split("|");var rid=ranNorm(p[0]);if(!rid)return;
        ran[rid]=1;
        out[rid+"|"+p[1]+"|"+di]=v;
        dcap[rid+"|"+p[1]+"|"+di]=1;
      });
    });
    Object.keys(dcap).forEach(function(kk){org[kk]=[{rej:out[kk],de:"mano"}]});
    return {d:out,ranchos:Object.keys(ran),dias:dias,dcap:dcap,org:org,tOrg:rOrg,tCv:rCv};
  },[D,sem,dom]);

  var ranchos=uM(function(){
    var s={};proy.ranchos.concat(real.ranchos).forEach(function(r){s[r]=1});
    var ord=["pvt","crp","f4h","fepo"];
    return Object.keys(s).sort(function(a,b){
      var ia=ord.indexOf(a),ib=ord.indexOf(b);
      if(ia<0)ia=99;if(ib<0)ib=99;
      return ia-ib||a.localeCompare(b);
    });
  },[proy,real]);

  // Con el filtro en "todos" va el total; con org o cv, solo esa parte.
  function P(r,c,d){var k=r+"|"+c+"|"+d;
    return (tipo==="org"?proy.org[k]:tipo==="cv"?proy.cv[k]:proy.d[k])||0}
  function R(r,c,d){var k=r+"|"+c+"|"+d;
    return (tipo==="cv"?real.tCv[k]:tipo==="org"?real.tOrg[k]:real.d[k])||0}
  function PO(r,c,d){return proy.org[r+"|"+c+"|"+d]||0}
  function PC(r,c,d){return proy.cv[r+"|"+c+"|"+d]||0}
  function RO(r,c,d){return real.tOrg[r+"|"+c+"|"+d]||0}
  function RC(r,c,d){return real.tCv[r+"|"+c+"|"+d]||0}

  function guardaDom(){
    var todo=JSON.parse(JSON.stringify((D&&D.dom)||{}));
    todo[sem]=dom;
    var loc=lsR("corte-dom")||{};loc[sem]=dom;lsS("corte-dom",loc);
    setGuard("Guardando...");
    fput("corte-dom-v1",todo).then(function(ok){
      setGuard(ok?"Guardado":"Guardado solo en esta computadora");
      setTimeout(function(){setGuard("")},3500);
    });
  }

        [{l:"Proyectaron",v:mil(totPro),c:"#8fb0c9",n:""},

        .map(function(k){

        })),

      filasHay?bloques:React.createElement("div",{style:{color:"#6b7280",padding:"18px"}},

      brecha.length?React.createElement("div",{style:{marginTop:"4px"}},

        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(340px,1fr))",gap:"7px"}},
          brecha.slice().sort(function(a,b){return Math.abs(b.d)-Math.abs(a.d)}).slice(0,8).map(function(x,i){
            var pct=pctDe(x.p,x.d),arriba=x.d>0;

              React.createElement("span",{style:{fontWeight:900,color:"#e6edf3"}},x.ran+" "+x.cu+": "),
              x.d===0?React.createElement("span",{style:{color:"#9fb8a4"}},"justo lo proyectado ("+mil(x.p)+" rejas)")
              :React.createElement("span",{style:{color:arriba?"#4ade80":"#f87171"}},
                "iban "+mil(x.p)+" y cortaron "+mil(x.r)+", "+
                (arriba?"se fueron arriba ":"se quedaron cortos ")+mil(Math.abs(x.d))+" rejas"+
                (pct===null?"":" ("+(pct>0?"+":"")+pct+"%)")),
              null);
          }))):null,

      React.createElement("div",{style:{marginTop:"12px",fontSize:"11px",color:"#6b8a6f"}},

        "Lo que recibo no alcanzo a capturar se teclea con el boton Capturar a mano.  ",BUILD)));
