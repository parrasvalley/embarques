<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPIs | Parras Valley</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
/* ---------------------------------------------------------------------------
   KPI8 - 14/10/2026.
   [stated] Miguel: "eso de mejor y peor que el dia anterior, eso quitaselo, no
   me gusta. Lo que quiero son graficas de colores bonitas... colores elegantes,
   oscuros, como lo de la bolsa de valores. Negros, fondo negro con contrastes
   verde, rojo y amarillo en las lineas. Son lineas continuas. Y que todo lo que
   vayas a enumerar o KPI quepan en UNA SOLA LINEA HORIZONTAL. No lo quiero en
   dos renglones para una misma linea."
   - Fuera el semaforo y fuera el "que cambio contra el dia anterior".
   - Los KPIs de cada cultivo van en UN SOLO RENGLON que no se parte. Si no
     caben en la pantalla, el renglon se recorre de lado, pero nunca baja a un
     segundo renglon.
   - Graficas de LINEA CONTINUA sobre negro.
--------------------------------------------------------------------------- */
 :root{
   --bg:#05070a; --sup:#080c11;
   --card:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
   --bd:rgba(255,255,255,.09);
   --tx:#e9f0f5; --dim:#56708a; --az:#1f7fc4;
   --rel:0 1px 0 rgba(255,255,255,.09) inset, 0 -1px 0 rgba(0,0,0,.6) inset,
         0 10px 22px -10px #000;
   --relf:0 1px 0 rgba(255,255,255,.08) inset, 0 -2px 0 rgba(0,0,0,.55) inset,
          0 4px 10px -5px rgba(0,0,0,.9);
 }
 *{box-sizing:border-box}
 body{background:var(--bg);color:var(--tx);margin:0;padding:0;
   font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
   -webkit-font-smoothing:antialiased}
 .wrap{max-width:1180px;margin:0 auto;padding:12px 12px 60px}

 .top{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
 .logo{font-size:21px;font-weight:900;letter-spacing:3;color:#dbe7f2}
 .ver{font-size:10px;color:var(--dim);font-weight:800;letter-spacing:.6}

 .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;
   padding:12px 13px;margin-bottom:10px;box-shadow:var(--rel)}
 .et{font-size:9px;color:var(--dim);font-weight:900;letter-spacing:1.1}
 .h2{font-size:14px;font-weight:900;letter-spacing:.3}

 input,select{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);
   border-radius:9px;padding:7px 9px;color:#bcd3e8;font-family:inherit;
   font-size:15px;font-weight:800;outline:none;box-shadow:var(--relf)}
 button{font-family:inherit;cursor:pointer;border-radius:9px;font-weight:800;
   font-size:12px;padding:7px 11px;border:1px solid var(--bd);
   background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));
   color:var(--dim);box-shadow:var(--relf);transition:transform .07s}
 button:active{transform:translateY(1px)}
 button.rj{border-color:rgba(220,38,38,.6);
   background:linear-gradient(180deg,rgba(220,38,38,.3),rgba(220,38,38,.1));color:#ff9a9a}
 .congela{background:linear-gradient(180deg,rgba(31,127,196,.14),rgba(31,127,196,.03));
   border:1px solid rgba(31,127,196,.35);border-radius:11px;padding:9px 12px;
   font-size:12px;font-weight:700;color:#bcd3e8;line-height:1.55;margin-top:9px}
 button.p{border-color:rgba(22,163,74,.6);
   background:linear-gradient(180deg,rgba(22,163,74,.34),rgba(22,163,74,.12));color:#5ee08a}

 .chips{display:flex;gap:5px;flex-wrap:wrap}
 .chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;
   border-radius:999px;font-size:12px;font-weight:900;cursor:pointer;
   border:1px solid var(--bd);color:var(--dim);
   background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
   box-shadow:var(--relf);white-space:nowrap}
 .chip i{width:9px;height:9px;border-radius:3px;display:inline-block}
 .chip.on{color:#fff;border-color:rgba(255,255,255,.3)}

 /* ---- UN SOLO RENGLON DE KPIs, nunca dos ---- */
 .fila{display:flex;flex-wrap:nowrap;gap:6px;margin-top:9px;
   overflow-x:auto;overflow-y:hidden;padding-bottom:4px;
   scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
 .fila::-webkit-scrollbar{height:6px}
 .fila::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
 .b{flex:1 1 0;min-width:62px;border-radius:9px;padding:6px 7px 7px;
   border:1px solid var(--bd);
   background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.3));
   box-shadow:var(--relf)}
 .b .k{font-size:8px;color:var(--dim);font-weight:900;letter-spacing:.4;
   line-height:1.2;height:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .b .v{font-size:14.5px;font-weight:900;margin-top:3px;line-height:1.15;
   font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}

 .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;
   border-radius:999px;font-weight:900;font-size:12px;letter-spacing:.5;color:#fff;
   box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 4px 10px -4px #000}
 .big{font-size:25px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}

 .avisoR{background:linear-gradient(180deg,rgba(220,38,38,.18),rgba(220,38,38,.04));
   border:1px solid rgba(220,38,38,.4);color:#ffb3b3;border-radius:11px;
   padding:9px 12px;margin-bottom:9px;font-weight:700;font-size:13px;box-shadow:var(--relf)}
 .avisoV{background:linear-gradient(180deg,rgba(22,163,74,.18),rgba(22,163,74,.04));
   border:1px solid rgba(22,163,74,.45);color:#7ceb9a;border-radius:11px;
   padding:9px 12px;margin-bottom:9px;font-weight:800;font-size:13px;box-shadow:var(--relf)}

 /* ---- LA TABLA CORRIDA, estilo hoja de calculo ----
    [stated] Miguel, 16/10/2026: "Lo quiero en la informacion asi horizontal, a
    manera de tabla de Excel, corrida hacia abajo. Pero con el general arriba en
    el encabezado y hacia abajo el desglose." */
 tr.gen td{background:rgba(255,255,255,.055);font-weight:900;font-size:13.5px;
   border-top:2px solid rgba(255,255,255,.18);border-bottom:1px solid var(--bd)}
 tr.gen td:first-child{letter-spacing:.3}
 tr.det td:first-child{padding-left:14px}
 tr.por td{font-size:11px;color:#ef6a6a;font-weight:800;text-align:left;
   padding:2px 4px 8px 14px;border-bottom:1px solid var(--bd)}
 table{width:100%;border-collapse:collapse}
 th{font-size:8.5px;color:var(--dim);font-weight:900;letter-spacing:.7;padding:6px 4px;
    text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
 th:first-child,td:first-child{text-align:left}
 td{padding:7px 4px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;
    border-bottom:1px solid rgba(255,255,255,.045);white-space:nowrap}
 .tbl{overflow-x:auto}
 .vacio{text-align:center;color:#33465a;padding:34px 10px;font-size:15px;font-weight:800}

 /* ---- barras horizontales ---- */
 .bhr{display:flex;align-items:center;gap:9px;padding:3px 0;
   border-bottom:1px solid rgba(255,255,255,.04)}
 .bhf{width:54px;flex:none;font-size:11px;font-weight:900;color:var(--dim);
   text-align:right;font-variant-numeric:tabular-nums}
 .bhb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
 .bhl{display:flex;align-items:center;gap:7px;width:100%}
 .bhv{font-size:11px;font-weight:900;white-space:nowrap;
   font-variant-numeric:tabular-nums;flex:none}
 .tend{margin-top:9px;display:flex;flex-direction:column;gap:3px}
 .tendr{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;
   flex-wrap:wrap;font-variant-numeric:tabular-nums}
 .tendr i{width:11px;height:3px;border-radius:2px;display:inline-block;flex:none}
 .mut2{color:var(--dim);font-weight:700;font-size:11px}
 .tendp{margin-left:2px;padding:2px 8px;border-radius:999px;font-size:11px;
   font-weight:900;background:rgba(255,255,255,.07);color:var(--tx)}

 .lg{display:flex;gap:11px;flex-wrap:wrap;margin-top:6px;font-size:11px;font-weight:800}
 .lg span{display:inline-flex;align-items:center;gap:5px;color:var(--dim)}
 .lg i{width:11px;height:3px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<div id="r"></div>
<script type="text/babel">
var BUILD="v2026-10-17-KPI16";
var FB="https://parrasvalley-default-rtdb.firebaseio.com";
var NODO="kpi-dias-v1";
/* LA RAYA ENTRE LO NUEVO Y LO ANTERIOR. Es la misma que trae la aplicacion de
   gastos: del 12/10/2026 para aca son los dias del sistema nuevo. Lo de antes
   quedo de cuando se capturaba de otra forma, viene salteado (dias hay y dias
   no) y revuelve la grafica, asi que por defecto se ve SOLO LO NUEVO.
   [stated] Miguel, 14/10/2026: "le quitaste lo de el historial nuevo y viejo...
   me das un historial intermitente porque dias hay, dias no. Yo queria ver lo
   nuevo. Dejamelo para ver lo nuevo y lo viejo." */
var CORTE="2026-10-12";               /* el historial propio de KPIs, arranca vacio */
var LINEAS=["Persa","Slicer","Europeo","Morron","Minibel"];
/* COLORES, estilo pantalla de bolsa de valores sobre fondo negro.
   [stated] Miguel, 14/10/2026: "colores elegantes, oscuros, como lo de la bolsa
   de valores. Negros, fondo negro con contrastes verde, rojo y amarillo".
   Son colores de IDENTIDAD de cada cultivo, no semaforo: el verde no quiere
   decir bien ni el rojo mal, nada mas dicen de que cultivo es la linea. Los
   cinco se midieron contra el fondo negro: todos pasan contraste y se
   distinguen entre si tambien para quien ve mal los colores. */
var COLOR={Persa:"#16a34a",Slicer:"#1f7fc4",Europeo:"#bd8c00",
           Morron:"#dc2626",Minibel:"#a96ae8"};
function claro(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  function m(x){return Math.min(255,Math.round(x+(255-x)*0.34))}
  return "rgb("+m(r)+","+m(g)+","+m(b)+")"}
function oscuro(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return "rgb("+Math.round(r*.56)+","+Math.round(g*.56)+","+Math.round(b*.56)+")"}
/* Persa, Morron y Minibel se miden en KILOS; Europeo y Slicer en PIEZAS.
   Control de empaque ya guarda lo llegado y lo empacado en la unidad del cultivo. */
var UNID={Persa:"kg",Slicer:"pz",Europeo:"pz",Morron:"kg",Minibel:"kg"};

var uS=React.useState,uE=React.useEffect,uM=React.useMemo;
function fget(k){return fetch(FB+"/"+k+".json?t="+Date.now())
  .then(function(r){return r.json()}).catch(function(){return null})}
function fput(k,v){return fetch(FB+"/"+k+".json",{method:"PUT",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(v)})
  .then(function(r){return !!(r&&r.ok)}).catch(function(){return false})}
/* solo las llaves de un nodo, sin bajarse todo el contenido */
function fkeys(k){return fetch(FB+"/"+k+".json?shallow=true&t="+Date.now())
  .then(function(r){return r.json()}).catch(function(){return null})}
/* lee de las otras apps todo lo de UN dia. Lo usa la pantalla y el llenado
   del historial, para que los dos armen el dia exactamente igual. */
function leeDia(f){
  var pr=LINEAS.map(function(L){
    return fget("rendimientos-hist-v1/"+dk(f)+"/"+L+"/ranchos")
      .then(function(v){return {L:L,v:v}})});
  var pn=LINEAS.map(function(L){
    return fget("nomina-hist-v1/"+L+"/"+f).then(function(v){return {L:L,v:v}})});
  return Promise.all([Promise.all(pr),fget("gastos-dias-v1/"+f),Promise.all(pn),
                      fget("nomina-dias-v1/"+f)])
    .then(function(res){
      var R={},N={};
      res[0].forEach(function(x){if(x.v&&typeof x.v==="object")R[x.L]=x.v});
      res[2].forEach(function(x){if(x.v&&typeof x.v==="object")N[x.L]=x.v});
      return {rend:R,gast:res[1]||null,nom:N,hlin:horasDeLinea(res[3])};
    });
}
function n0(v){var x=parseFloat(v);return isNaN(x)?0:x}
function r1(n){return Math.round(n*10)/10}
function r2(n){return Math.round(n*100)/100}
function miles(n){return n0(n).toLocaleString("es-MX",{maximumFractionDigits:0})}
function dec(n,d){return n0(n).toLocaleString("es-MX",{minimumFractionDigits:d,maximumFractionDigits:d})}
function pesos(n){return "$"+dec(n,2)}
function dk(f){return String(f||"").replace(/-/g,"")}
function hoy(){var d=new Date();return d.toISOString().slice(0,10)}
function mueveDia(f,n){var d=new Date(f+"T12:00:00");d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10)}
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
/* cuando se tomo la copia de un dia */
function cuando(ts){
  if(!ts)return "antes";
  var d=new Date(ts), z=function(n){return ("0"+n).slice(-2)};
  return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear()+" "+
         z(d.getHours())+":"+z(d.getMinutes());
}
function fLargo(f){if(!f)return "";var p=f.split("-");
  return parseInt(p[2],10)+" "+MES[parseInt(p[1],10)-1]+" "+p[0]}


/* ---------- LAS HORAS DE TRABAJO DE LA LINEA, DEL HORARIO REAL ----------
   [stated] Miguel, 14/10/2026: "Lo que importa es cuanto trabajo la LINEA, no
   horas hombre. Si la linea trabajo cinco horas con diez hombres traes 50 horas
   hombre, pero realmente fueron cinco horas de trabajo."
   Se lee el horario de verdad, nomina-dias-v1/{fecha}.lin, y se SUMAN las horas
   que cada cuadrilla le metio a ese cultivo.
   [stated] 14/10: cuando DOS cuadrillas trabajan el mismo cultivo al mismo tiempo,
   las horas SE SUMAN, no se juntan: "eran dos lineas, linea Persa/Slicer trabajando
   para el Slicer y linea Euro trabajando para el Slicer. Si tu sumas eso te va a dar
   10.5". Se intento quitar el traslape y daba 8, y el no lo reconocia como suyo.
   Las horas de cada cuadrilla siempre cuadran con su jornada.
   Comida y Cena no son trabajo y no cuentan. Los paros SI cuentan como tiempo de
   la linea (la linea estaba ocupada en esa fruta) y ademas se reportan aparte,
   porque son justo lo que explica un costo alto. */
function aMin(t){var m=/^(\d{1,2}):(\d{2})$/.exec(String(t||""));
  return m?parseInt(m[1],10)*60+parseInt(m[2],10):null}
function esComida(a){var x=String(a||"").toLowerCase();
  return x.indexOf("comida")>=0||x.indexOf("cena")>=0}
function esParo(a){return String(a||"").toLowerCase().indexOf("paro")>=0}
function suma(iv){var t=0;iv.forEach(function(x){t+=x[1]-x[0]});return t}
function horasDeLinea(dias){
  var out={};                       /* area -> {min, paro} */
  if(!dias||!dias.lin)return null;
  Object.keys(dias.lin).forEach(function(k){
    var rr=dias.lin[k]; if(!rr||!rr.length)return;
    /* la primera area real del dia, para los paros que caen antes de empezar */
    var prim="";
    for(var j=0;j<rr.length;j++){var a0=rr[j].ar;
      if(a0&&!esComida(a0)&&!esParo(a0)){prim=a0;break}}
    var ult="";
    for(var i=0;i<rr.length;i++){
      var r=rr[i]||{}, de=aMin(r.de), a=aMin(r.a), ar=r.ar;
      if(de===null||a===null)continue;
      if(a<=de)a+=1440;                     /* paso de la medianoche */
      if(esComida(ar))continue;             /* no es trabajo */
      var area=ar;
      if(esParo(ar))area=ult||prim;         /* el paro se carga donde venia */
      if(!area)continue;
      if(!out[area])out[area]={iv:[],ivP:[]};
      out[area].iv.push([de,a]);
      if(esParo(ar))out[area].ivP.push([de,a,String(ar)]);
      if(!esParo(ar))ult=ar;
    }
  });
  var res={};
  Object.keys(out).forEach(function(A){
    /* El desglose del paro va MINUTO POR MINUTO: si dos cuadrillas estan paradas
       a la misma hora en el mismo cultivo, ese minuto se cuenta UNA vez y se le
       queda al motivo que llego primero. Asi los motivos siempre suman el total
       de horas paradas, ni mas ni menos. */
    /* El motivo se suma igual que las horas: si dos cuadrillas estan paradas
       a la misma hora en el mismo cultivo, son dos lineas paradas y cuentan las
       dos. Asi los motivos suman exacto las horas paradas de ese cultivo. */
    var mot={};
    out[A].ivP.forEach(function(iv){
      mot[iv[2]]=(mot[iv[2]]||0)+(iv[1]-iv[0]);
    });
    res[A]={min:suma(out[A].iv),paro:suma(out[A].ivP),mot:mot};
  });
  return res;
}

var MOT={"Paro fruta":"falta de fruta","Paro mecanico":"falla mecánica",
          "Paro luz":"falta de luz","Paro otro":"otro"};
function nomMot(k){return MOT[k]||String(k).replace(/^Paro\s*/i,"")}
function listaParo(mot){
  var ks=Object.keys(mot||{}).sort(function(a,b){return mot[b]-mot[a]});
  if(!ks.length)return "";
  return ks.map(function(k){return dec(mot[k]/60,1)+" h "+nomMot(k)}).join(" · ");
}
function calVal(c,u){
  if(!c)return 0;
  if(u==="pz"){
    if(n0(c.pz)>0)return n0(c.pz);          /* Europeo: ya viene en piezas */
    if(n0(c.cj)>0)return n0(c.cj)*36;       /* Slicer: cajas de 36 CT -> piezas */
    return 0;
  }
  return n0(c.kg);
}

/* ---------- arma el dia con lo que ya guardaron las otras apps ---------- */
function armaDia(rend,gast,nom,hlin){
  var filas=[],T={rejas:0,bultos:0,gasto:0,min:0,mx:0,np:0};
  LINEAS.forEach(function(L){
    var R=rend[L]||null, G=(gast&&gast[L])||null, N=nom[L]||null;
    var rejas=0,rec=0,emp=0,ca=0,cb=0,cc=0;
    if(R){Object.keys(R).forEach(function(k){
      var r=R[k]||{};
      rejas+=n0(r.rejas); rec+=n0(r.kgRec); emp+=n0(r.kgEmp);
      var d=r.det||{};
      /* OJO CON LAS UNIDADES DEL DETALLE POR CALIDAD.
         Persa, Morron y Minibel: lo llegado y el detalle van los dos en KILOS.
         Europeo: los dos en PIEZAS (el detalle trae pz).
         Slicer: lo llegado va en PIEZAS pero el detalle trae los KILOS y las
         CAJAS de 36 CT. Sumar esos kilos contra piezas da porcentajes absurdos,
         asi que ahi se usan las cajas por 36, que es justo lo empacado. */
      ca+=calVal(d.a,UNID[L]); cb+=calVal(d.b,UNID[L]); cc+=calVal(d.c,UNID[L]);
    })}
    var min=N?n0(N.min):0, mx=N?n0(N.mx):0, np=N?n0(N.np):0;
    /* DOS HORAS DISTINTAS, Y NO SE CRUZAN (Miguel, 14/10/2026).
       HORAS HOMBRE = la suma de lo que trabajaron todas las personas en esa
       linea. Sirve para el COSTO, porque eso es lo que se paga.
       HORAS DE LINEA = las horas de RELOJ que la linea estuvo en ese cultivo,
       o sea horas hombre entre la gente. Si 24 personas metieron 132 horas
       hombre, la linea corrio 5.5 horas. ESA es con la que se mide el ritmo:
       los bultos y las rejas por hora van sobre las horas de linea, no sobre
       las horas hombre. Con horas hombre salian 26 bultos/hora y no cuadraba
       con lo que el ve en el empaque. */
    var hh=min/60, hx=mx/60;
    var HL=hlin&&hlin[L]?hlin[L]:null;
    var h=HL?HL.min/60:(np>0?(min/np)/60:0);   /* del horario real; si no hay, promedio */
    var hpar=HL?HL.paro/60:0;
    var mot=HL?(HL.mot||{}):{};
    /* [stated] 14/10: el ritmo se saca con las horas EFECTIVAS, las que de verdad
       se estuvo trabajando. "Me vas a poner que fueron diez pero seis paradas y
       cuatro trabajando, y me divides entre cuatro lo que realmente trabajo".
       Las horas totales y las paradas se siguen reportando, porque son las que se
       pagan y las que explican el costo. */
    var hef=h-hpar; if(hef<0)hef=0;
    var exacta=!!HL;
    var bultos=G?n0(G.bultos):0, gasto=G?n0(G.totalCosto):0;
    var merma=rec-emp;
    if(!R&&!G&&!N)return;                      /* esa linea no corrio ese dia */
    filas.push({L:L,u:UNID[L],rejas:rejas,rec:rec,emp:emp,
      pa:rec>0?100*ca/rec:0, pb:rec>0?100*cb/rec:0, pc:rec>0?100*cc/rec:0,
      pm:rec>0?100*merma/rec:0, merma:merma,
      h:h,hef:hef,hh:hh,hx:hx,hpar:hpar,mot:mot,exacta:exacta,np:np,bultos:bultos,gasto:gasto,

function cmp(hoyV,antV,menosEsMejor){
  if(ant0(antV)===0||hoyV===undefined||hoyV===null)return null;
  var d=hoyV-antV, p=100*d/Math.abs(antV);
  if(Math.abs(p)<0.5)return null;     /* si no se movio, no se escribe nada */
  var bueno=menosEsMejor?(d<0):(d>0);
  return {t:(d>0?"▲ ":"▼ ")+dec(Math.abs(p),1)+"%", c:bueno?"up":"dn", p:p};
}

      "$"+miles(x.gasto),
      <span style={{color:gen?"#5ee08a":COLOR[x.L],fontWeight:900}}>{pesos(x.cpb)}</span>,
      gen?ray:dec(x.pa,1)+"%", gen?ray:dec(x.pb,1)+"%",
      gen?ray:dec(x.pc,1)+"%", gen?ray:dec(x.pm,1)+"%"
    ];
  }
  /* los renglones de UNA fecha: el general y su desglose */
  function RenglonesDe(e){
    if(!e||!e.filas||!e.filas.length)return null;
    var fil=e.filas.filter(function(x){return !cul||x.L===cul});
    if(!fil.length)return null;
    var G=cul?fil[0]:e.tot;
    var out=[];
    out.push(
      <tr className="gen" key={e.f+"|g"}>
        <td>{fLargo(e.f)}{cul?"":"  ·  general"}</td>
        {celdas(G,true).map(function(v,i){return <td key={i}>{v}</td>})}
      </tr>);
    fil.forEach(function(x){
      out.push(
        <tr className="det" key={e.f+"|"+x.L}>
          <td><span className="pill" style={{fontSize:10,padding:"2px 9px",
            background:COLOR[x.L]}}>{x.L}</span>
            {queFaltaL(x)&&<span style={{color:"#d9a400",fontWeight:800,
              fontSize:10.5,marginLeft:6}}>{queFaltaL(x)}</span>}</td>
          {celdas(x,false).map(function(v,i){return <td key={i}>{v}</td>})}
        </tr>);
      if(x.hpar>0)out.push(
        <tr className="por" key={e.f+"|"+x.L+"|p"}>
          <td colSpan={COLS.length+1}>
            {x.L}: {dec(x.hpar,1)} h paradas de {dec(x.h,1)} · {listaParo(x.mot)}</td>
        </tr>);
    });
    return out;
  }
  function queFaltaL(x){
    var f=x.falta||{},q=[];
    if(f.rend)q.push("rejas"); if(f.gast)q.push("costo"); if(f.nom)q.push("horas");
    return q.length?("sin "+q.join(", ")):"";
  }
  function Tabla(props){
    var ds=props.dias||[];
    var cuerpo=ds.map(RenglonesDe).filter(function(x){return x});
    if(!cuerpo.length)return <div className="vacio">No hay nada que mostrar.</div>;
    return (
    <div className="card">
      <div className="et">{cuerpo.length+" "+(cuerpo.length===1?"día":"días")
        +"  ·  "+(cul?cul.toUpperCase():"TODOS LOS CULTIVOS")}</div>
      <div className="tbl" style={{marginTop:7}}><table>
        <Encabezado/>
        <tbody>{cuerpo}</tbody>
      </table></div>
    </div>);
  }

  return (
  <div className="wrap">
    <div className="top">
      <div className="logo">KPIs</div>
      <div className="ver">PARRAS VALLEY · {BUILD}</div>
    </div>

    {/* ---------------- FILTROS: CULTIVO Y FECHA ---------------- */}
    <div className="card">
      <div className="et">CULTIVO</div>
      <div className="chips" style={{marginTop:6}}>
        <div className={"chip"+(cul===""?" on":"")} onClick={function(){setCul("")}}
          style={cul===""?{background:"linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.03))"}:null}>
          TODOS</div>
        {LINEAS.map(function(L){return (
          <div key={L} className={"chip"+(cul===L?" on":"")} onClick={function(){setCul(L)}}
            style={cul===L?{background:COLOR[L],borderColor:COLOR[L],color:"#fff"}:null}>
            <i style={{background:COLOR[L]}}/>{L.toUpperCase()}</div>)})}
      </div>

      <div className="et" style={{marginTop:11}}>HISTORIAL</div>
      <div className="chips" style={{marginTop:6,alignItems:"center"}}>
        {[["nue","NUEVO"],["ant","ANTERIOR"],["todo","TODO"]].map(function(o){
          return (
          <div key={o[0]} className={"chip"+(ori===o[0]?" on":"")}
            style={ori===o[0]?{background:"linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.03))"}:null}
            onClick={function(){setOri(o[0])}}>
            {o[1]}<span style={{opacity:.6,marginLeft:4}}>{cuenta[o[0]]}</span></div>)})}
        <span style={{fontSize:10.5,color:"var(--dim)",fontWeight:800,marginLeft:4}}>
          lo nuevo es del {fLargo(CORTE)} para acá</span>
      </div>

      <div className="et" style={{marginTop:11}}>FECHA</div>
      <div className="chips" style={{marginTop:6,alignItems:"center"}}>
        <div className={"chip"+(modo==="dia"?" on":"")} onClick={function(){setModo("dia")}}
          style={modo==="dia"?{background:"linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.03))"}:null}>
          UN DÍA</div>
        <div className={"chip"+(modo==="todas"?" on":"")} onClick={function(){setModo("todas")}}
          style={modo==="todas"?{background:"linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.03))"}:null}>
          TODAS LAS FECHAS</div>
        {modo==="dia"&&<input type="date" value={f}
          onChange={function(e){setF(e.target.value);setMsg("")}}/>}
        {modo==="dia"&&<button onClick={function(){setF(mueveDia(f,-1));setMsg("")}}>&laquo;</button>}
        {modo==="dia"&&<button onClick={function(){setF(mueveDia(f,1));setMsg("")}}>&raquo;</button>}
        {modo==="dia"&&f!==hoy()&&<button onClick={function(){setF(hoy());setMsg("")}}>hoy</button>}
        <div style={{flex:1}}/>
        {modo==="todas"&&<button className="p" onClick={function(){escanea(true)}}>Actualizar</button>}
      </div>
      {msg&&<div style={{fontSize:12,fontWeight:800,marginTop:7,
        color:msg.indexOf("✗")>=0?"#ef6a6a":msg.indexOf("✓")>=0?"#5ee08a":"var(--dim)"}}>{msg}</div>}
    </div>

    {avBul&&<div className={avBul.indexOf("✗")>=0?"avisoR":"avisoV"}>{avBul}</div>}

    {/* ====================  UN DÍA  ==================== */}
    {modo==="dia"&&(
    <div>
      {cargando&&<div className="vacio">Leyendo las apps...</div>}
      {!cargando&&faltan.map(function(t,i){return <div className="avisoR" key={i}>{t}</div>})}
      {!cargando&&dia&&filasVer.length>0&&<Tabla dias={[{f:f,filas:dia.filas,tot:dia.tot}]}/>}
      {!cargando&&dia&&filasVer.length===0&&
        <div className="vacio">{cul?("No hay "+cul+" este día."):"No hay nada de este día todavía."}</div>}
    </div>)}

    {/* ====================  TODAS LAS FECHAS  ==================== */}
    {modo==="todas"&&(
    <div>
      <Llenar mt={0}/>
      <div style={{height:9}}/>
      {fechas.length===0
        ? <div className="card">
            <div className="h2">Sin fechas</div>
            <div style={{fontSize:13,color:"var(--dim)",fontWeight:700,marginTop:8,lineHeight:1.6}}>
              {nTot===0
                ? "No hay ni una fecha en gastos, nómina ni control de empaque."
                : (cuenta.todo===0
                   ? ("Hay "+nTot+" "+(nTot===1?"día":"días")+", pero ninguno trae "+(cul||"ese cultivo")+".")
                   : ("En "+(ori==="nue"?"LO NUEVO":(ori==="ant"?"LO ANTERIOR":"TODO"))+" no hay días"+(cul?(" de "+cul):"")+". De este cultivo hay "+cuenta.nue+" en lo nuevo y "+cuenta.ant+" en lo anterior."))}
            </div>
          </div>
        : <Tabla dias={fechas.slice().reverse().map(function(k){return hist[k]})}/>}
    </div>)}
  </div>);
}
ReactDOM.createRoot(document.getElementById("r")).render(<App/>);
</script>
</body>
</html>
